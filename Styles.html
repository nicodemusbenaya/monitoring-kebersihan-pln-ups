<style>
  :root {
    --pln-blue: #0076a8;
    --pln-blue-dark: #00577d;
    --pln-blue-soft: #e8f5fa;
    --pln-yellow: #ffd100;
    --pln-red: #e42313;
    --ink: #17313d;
    --muted: #647783;
    --line: #d9e4e9;
    --surface: #ffffff;
    --surface-soft: #f7fafb;
    --canvas: #f3f7f9;
    --blue: #0076a8;
    --success: #157a55;
    --success-soft: #e7f6ef;
    --danger: #bd2d22;
    --danger-soft: #fff0ee;
    --warning: #9a6500;
    --warning-soft: #fff7d6;
    --radius-card: 16px;
    --radius-control: 10px;
    --shadow: 0 14px 36px rgba(0, 72, 101, .10);
    --shadow-sm: 0 8px 20px rgba(0, 72, 101, .07);
  }

  * { box-sizing: border-box; }
  html { width: 100%; max-width: 100%; overflow-x: hidden; background: var(--canvas); color: var(--ink); font-family: "Segoe UI", Arial, sans-serif; }
  body { width: 100%; max-width: 100%; overflow-x: hidden; margin: 0; min-width: 320px; min-height: 100dvh; }
  button, input, textarea, select { font: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .58; }
  img { max-width: 100%; }
  a { color: var(--pln-blue-dark); }
  .hidden { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  .app-shell, #app { width: 100%; max-width: 100%; min-width: 0; min-height: 100dvh; overflow-x: hidden; }
  .initial-loader { min-height: 100dvh; display: grid; place-content: center; gap: 14px; width: min(360px, calc(100% - 48px)); margin: auto; }
  .brand-mark { width: 156px; height: 64px; display: grid; place-items: center; }
  .brand-mark img { display: block; width: min(150px, 100%); max-height: 58px; object-fit: contain; object-position: center; }
  .status-symbol { width: 22px; height: 22px; display: inline-grid; flex: 0 0 auto; place-items: center; color: currentColor; }
  .status-symbol svg { display: block; width: 100%; height: 100%; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .skeleton-line { height: 14px; width: 72%; border-radius: 6px; background: linear-gradient(90deg,#e1e9ed,#f7fafb,#e1e9ed); background-size: 220% 100%; animation: shimmer 1.2s linear infinite; }
  .skeleton-line.wide { width: 100%; height: 22px; }
  @keyframes shimmer { to { background-position: -220% 0; } }

  .scan-loading-page {
    min-height: calc(100dvh - 72px); padding: 28px 20px;
    display: grid; place-items: center; background: var(--canvas);
  }
  .scan-loading-card {
    width: min(460px, 100%); padding: 34px 30px 30px; overflow: hidden;
    border: 1px solid var(--line); border-top: 4px solid var(--pln-yellow);
    border-radius: var(--radius-card); background: var(--surface);
    box-shadow: 0 18px 42px rgba(0,72,101,.11); text-align: center;
  }
  .scan-loader-visual { width: 96px; height: 96px; margin: 0 auto 22px; padding: 8px; }
  .scan-loader-frame {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    display: grid; place-items: center; border: 2px solid var(--pln-blue);
    border-radius: 14px; background: #f7fbfd;
  }
  .scan-loader-frame::before,.scan-loader-frame::after {
    content: ""; position: absolute; inset: 9px; border: 1px solid rgba(0,118,168,.18); border-radius: 8px;
  }
  .scan-loader-frame::after { inset: 18px; border-color: rgba(0,118,168,.10); }
  .scan-loader-frame img { position: relative; z-index: 1; width: 58px; max-height: 42px; object-fit: contain; }
  .scan-loader-beam {
    position: absolute; z-index: 2; left: 8px; right: 8px; height: 3px;
    border-radius: 3px; background: var(--pln-yellow); box-shadow: 0 0 0 1px rgba(255,209,0,.18);
    animation: scanBeam 1.35s cubic-bezier(.4,0,.2,1) infinite alternate;
  }
  .scan-loading-status { margin-bottom: 8px; color: var(--success); font-size: 13px; font-weight: 850; }
  .scan-loading-card h1 { margin: 0; color: var(--ink); font-size: clamp(24px,6vw,31px); letter-spacing: -.025em; line-height: 1.12; }
  .scan-loading-card p { max-width: 35ch; margin: 11px auto 24px; color: var(--muted); font-size: 14px; line-height: 1.55; }
  .scan-loading-card small { display: block; margin-top: 18px; color: #70838c; font-size: 11px; }
  .scan-loading-skeleton { display: grid; gap: 8px; text-align: left; }
  .scan-loading-skeleton span {
    display: block; height: 11px; border-radius: 5px; background: #dfe9ed;
    animation: scanSkeleton 1.2s ease-in-out infinite;
  }
  .scan-loading-skeleton span:nth-child(1) { width: 100%; }
  .scan-loading-skeleton span:nth-child(2) { width: 82%; animation-delay: .14s; }
  .scan-loading-skeleton span:nth-child(3) { width: 62%; animation-delay: .28s; }
  @keyframes scanBeam { from { transform: translateY(-31px); } to { transform: translateY(31px); } }
  @keyframes scanSkeleton { 0%,100% { opacity: .42; } 50% { opacity: 1; } }

  .login-layout { min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(380px, .95fr); }
  .login-brand { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: clamp(34px, 6vw, 80px); color: white; background: var(--pln-blue-dark); }
  .login-brand::before { content: ""; position: absolute; width: 440px; height: 440px; right: -170px; bottom: -190px; border: 84px solid rgba(255,209,0,.95); border-radius: 50%; }
  .login-brand::after { content: ""; position: absolute; width: 170px; height: 170px; right: 80px; top: 60px; border: 2px solid rgba(255,255,255,.22); transform: rotate(18deg); }
  .login-brand > * { position: relative; z-index: 1; }
  .login-brand .brand-mark {
    width: 174px;
    height: 66px;
    padding: 10px 14px;
    border: 1px solid rgba(255,255,255,.72);
    border-radius: 12px;
    background:
      radial-gradient(circle at 16% 12%, rgba(255,209,0,.28), transparent 42%),
      linear-gradient(118deg, #fffdf5 0%, #f2fbfe 58%, #dceff7 100%);
    box-shadow: 0 14px 34px rgba(0,43,62,.22), inset 0 1px 0 rgba(255,255,255,.9);
  }
  .login-brand .brand-mark img { width: 100%; max-height: 46px; object-position: center; }
  .login-copy { max-width: 600px; }
  .login-copy h1 { margin: 0 0 18px; font-size: clamp(38px, 5.3vw, 72px); line-height: .98; letter-spacing: -.045em; max-width: 11ch; }
  .login-copy p { margin: 0; max-width: 42ch; font-size: 18px; line-height: 1.55; color: rgba(255,255,255,.8); }
  .room-chip { align-self: flex-start; padding: 10px 14px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); border-radius: 999px; font-weight: 700; }
  .login-panel { display: grid; place-items: center; padding: 32px; background: var(--surface); }
  .login-card { width: min(430px, 100%); }
  .login-card h2 { font-size: 30px; margin: 0 0 8px; letter-spacing: -.02em; }
  .login-card > p { margin: 0 0 30px; color: var(--muted); line-height: 1.55; }

  .field { display: grid; gap: 7px; margin-bottom: 18px; }
  .field label, .field-label { font-size: 14px; font-weight: 700; color: #304b57; }
  .field input, .field textarea, .field select {
    width: 100%; min-height: 48px; border: 1px solid #b9cbd3; border-radius: var(--radius-control); background: white; color: var(--ink); padding: 11px 13px; outline: none;
  }
  .field textarea { resize: vertical; min-height: 92px; }
  .field select, .filter-control select {
    appearance: none;
    padding-right: 44px;
    background-image:
      linear-gradient(45deg, transparent 50%, #56707b 50%),
      linear-gradient(135deg, #56707b 50%, transparent 50%);
    background-position:
      calc(100% - 19px) calc(50% - 2px),
      calc(100% - 14px) calc(50% - 2px);
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--pln-blue); box-shadow: 0 0 0 3px rgba(0,118,168,.15); }
  .field-hint { color: var(--muted); font-size: 12px; line-height: 1.45; }
  .form-error { padding: 12px 14px; border-left: 4px solid var(--danger); background: var(--danger-soft); color: #872018; margin-bottom: 16px; border-radius: 6px; }
  .required { color: var(--danger); }

  .btn { min-height: 44px; border: 1px solid transparent; border-radius: var(--radius-control); padding: 10px 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 750; line-height: 1.2; transition: transform .12s ease, background .16s ease, border-color .16s ease; }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--pln-blue); color: white; }
  .btn-primary:hover { background: var(--pln-blue-dark); }
  .btn-secondary { background: white; color: var(--pln-blue-dark); border-color: #a9c2cd; }
  .btn-secondary:hover { background: var(--pln-blue-soft); }
  .btn-danger { background: var(--danger-soft); color: var(--danger); border-color: #efb9b3; }
  .btn-quiet { background: transparent; color: var(--pln-blue-dark); border-color: transparent; }
  .btn-block { width: 100%; }
  .btn-sm { min-height: 36px; padding: 7px 11px; font-size: 13px; }

  .topbar { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line); }
  .topbar-inner { width: 100%; max-width: 1240px; min-width: 0; min-height: 72px; margin: auto; padding: 10px 22px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .topbar-brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .topbar-brand img { width: 104px; max-height: 40px; object-fit: contain; }
  .brand-divider { width: 1px; height: 34px; background: var(--line); }
  .topbar-title { min-width: 0; }
  .topbar-title strong, .topbar-title span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar-title span { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .user-area { min-width: 0; display: flex; align-items: center; gap: 12px; }
  .user-copy { text-align: right; }
  .user-copy strong, .user-copy span { display: block; }
  .user-copy span { color: var(--muted); font-size: 12px; margin-top: 2px; }

  .page { width: 100%; max-width: 1240px; min-width: 0; margin: auto; padding: 32px 22px 60px; }
  .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 22px; margin-bottom: 26px; }
  .page-heading h1 { margin: 0; font-size: clamp(28px, 4vw, 44px); letter-spacing: -.035em; line-height: 1.06; }
  .page-heading p { margin: 9px 0 0; color: var(--muted); line-height: 1.5; }
  .eyebrow { color: var(--pln-blue-dark); font-size: 13px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 8px; }

  .room-banner { min-width: 0; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 20px; background: var(--pln-blue-dark); color: white; border-radius: var(--radius-card); padding: 24px; margin-bottom: 22px; box-shadow: var(--shadow); }
  .room-banner h1 { margin: 0; font-size: clamp(27px, 5vw, 42px); letter-spacing: -.03em; }
  .room-banner p { color: rgba(255,255,255,.74); margin: 8px 0 0; }
  .scan-box { align-self: center; border-left: 1px solid rgba(255,255,255,.2); padding-left: 24px; min-width: 180px; }
  .scan-box span, .scan-box strong { display: block; }
  .scan-box span { color: rgba(255,255,255,.7); font-size: 12px; margin-bottom: 5px; }

  .notice { padding: 14px 16px; border-radius: var(--radius-control); margin-bottom: 20px; line-height: 1.5; }
  .notice-info { background: #eaf6fb; color: #14516a; border-left: 4px solid var(--pln-blue); }
  .notice-warning { background: var(--warning-soft); color: #725000; border-left: 4px solid var(--pln-yellow); }
  .notice-success { background: var(--success-soft); color: #0f5e40; border-left: 4px solid var(--success); }
  .notice-danger { background: var(--danger-soft); color: #872018; border-left: 4px solid var(--danger); }

  .checklist { display: grid; gap: 14px; }
  .activity-card { background: white; border: 1px solid var(--line); border-radius: var(--radius-card); padding: 20px; }
  .activity-head { display: grid; grid-template-columns: 40px 1fr; align-items: start; gap: 14px; }
  .activity-number { width: 38px; height: 38px; margin-top: 1px; display: grid; place-items: center; background: var(--pln-blue-soft); color: var(--pln-blue-dark); border-radius: 10px; font-weight: 850; }
  .activity-heading-copy { min-width: 0; }
  .activity-name { font-weight: 760; line-height: 1.42; }
  .activity-standard { margin-top: 8px; padding: 10px 12px; border-left: 3px solid var(--pln-yellow); border-radius: 0 9px 9px 0; background: #f5fafc; color: #405b67; }
  .activity-standard-label { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 9px; margin-bottom: 4px; color: var(--pln-blue-dark); font-size: 12px; font-weight: 850; }
  .activity-standard-label span { color: #6a7f88; font-weight: 700; }
  .activity-standard p, .activity-standard ul { margin: 0; font-size: 12.5px; line-height: 1.5; }
  .activity-standard ul { padding-left: 18px; }
  .activity-standard li + li { margin-top: 5px; }
  .field-span-2 { grid-column: 1 / -1; }
  .activity-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 16px; }
  .choice-row { display: grid; gap: 6px; }
  .choice-label { font-size: 13px; font-weight: 700; color: #304b57; }
  .choice-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .choice { position: relative; }
  .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .choice label { display: flex; min-height: 44px; justify-content: center; align-items: center; border: 1px solid #b9cbd3; border-radius: var(--radius-control); font-size: 14px; font-weight: 750; background: white; }
  .choice input:focus + label { box-shadow: 0 0 0 3px rgba(0,118,168,.16); }
  .choice.clean input:checked + label { border-color: var(--success); color: var(--success); background: var(--success-soft); }
  .choice.dirty input:checked + label { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }
  .finding-fields { display: none; grid-template-columns: 1fr 1fr; gap: 14px; padding-top: 18px; margin-top: 18px; border-top: 1px solid var(--line); }
  .activity-card.is-dirty .finding-fields { display: grid; }
  .finding-fields .field { margin: 0; }
  .file-control { border: 1px dashed #9fb6c0; padding: 12px; border-radius: var(--radius-control); background: #f9fbfc; }
  .file-control input { min-height: auto; border: 0; padding: 0; box-shadow: none; }
  .photo-preview { display: none; margin-top: 10px; width: 120px; height: 92px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  .photo-preview.has-image { display: block; }
  .submit-bar { position: sticky; bottom: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 20px; background: rgba(255,255,255,.97); border: 1px solid var(--line); border-radius: var(--radius-card); padding: 14px 16px; margin-top: 20px; box-shadow: 0 -8px 28px rgba(0,72,101,.09); }
  .submit-bar p { margin: 0; color: var(--muted); font-size: 13px; }

  .admin-tabs { display: flex; gap: 6px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 3px; }
  .admin-tab { white-space: nowrap; min-height: 42px; border: 0; padding: 9px 15px; border-radius: var(--radius-control); color: #4e6671; background: transparent; font-weight: 750; }
  .admin-tab.active { color: white; background: var(--pln-blue); }
  .admin-nav { position: sticky; top: 72px; z-index: 18; background: rgba(255,255,255,.97); border-bottom: 1px solid var(--line); }
  .admin-nav-inner { max-width: 1240px; margin: auto; padding: 0 22px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .admin-nav-inner::-webkit-scrollbar { display: none; }
  .admin-nav button {
    appearance: none; position: relative; flex: 0 0 auto; min-height: 50px; padding: 0 14px;
    border: 0; border-radius: 0; background: transparent; color: #536b76; font-weight: 750;
    white-space: nowrap; transition: color .16s ease, background .16s ease;
  }
  .admin-nav button:hover { color: var(--pln-blue-dark); background: #f6fafb; }
  .admin-nav button.active { color: var(--pln-blue-dark); background: var(--pln-blue-soft); }
  .admin-nav button.active::after {
    content: ""; position: absolute; left: 14px; right: 14px; bottom: 0; height: 3px;
    background: var(--pln-blue); border-radius: 3px 3px 0 0;
  }
  .dashboard-hero {
    width: 100%; min-width: 0; display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: end; gap: 30px;
    margin-bottom: 22px;
  }
  .dashboard-hero h1 { margin: 0; font-size: clamp(30px,4vw,44px); line-height: 1.04; letter-spacing: -.035em; }
  .dashboard-hero p { margin: 9px 0 0; color: var(--muted); font-size: 15px; }
  .dashboard-filter { justify-content: flex-end; }
  .dashboard-metrics { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 14px; margin-bottom: 18px; }
  .dashboard-metric {
    min-width: 0; min-height: 132px; display: grid; grid-template-columns: auto minmax(0,1fr); align-items: center; gap: 16px;
    padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0,72,101,.055); transition: transform .18s ease, box-shadow .18s ease;
  }
  .dashboard-metric:hover { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(0,72,101,.09); }
  .dashboard-metric > div:last-child { min-width: 0; }
  .dashboard-metric span:not(.metric-mark) { display: block; color: #3f5863; font-size: 13px; font-weight: 700; }
  .dashboard-metric strong { display: block; margin-top: 5px; color: var(--pln-blue-dark); font-size: 34px; line-height: 1; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
  .dashboard-metric small { display: block; margin-top: 7px; color: var(--muted); font-size: 12px; line-height: 1.35; }
  .completion-dial {
    --completion: 0; position: relative; width: 74px; height: 74px; display: grid; place-items: center; flex: 0 0 auto;
    border-radius: 50%; background: conic-gradient(var(--pln-blue) calc(var(--completion) * 1%),#e5eef2 0);
  }
  .completion-dial::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: white; }
  .completion-dial span { position: relative; z-index: 1; color: var(--pln-blue-dark)!important; font-size: 17px!important; font-weight: 850!important; font-variant-numeric: tabular-nums; }
  .metric-mark { width: 62px; height: 62px; display: grid; place-items: center; border-radius: 14px; }
  .metric-mark .status-symbol { width: 31px; height: 31px; }
  .dashboard-metric.done .metric-mark { color: var(--success); background: var(--success-soft); }
  .dashboard-metric.finding .metric-mark { color: var(--danger); background: var(--danger-soft); }
  .dashboard-metric.pending .metric-mark { color: var(--warning); background: var(--warning-soft); }
  .dashboard-metric.done strong { color: var(--success); }
  .dashboard-metric.finding strong { color: var(--danger); }
  .dashboard-metric.pending strong { color: var(--warning); }
  .dashboard-board { width: 100%; min-width: 0; display: grid; grid-template-columns: minmax(0,1.7fr) minmax(0,.9fr); gap: 18px; align-items: start; }
  .dashboard-main-column { display: grid; gap: 18px; min-width: 0; }
  .dashboard-side { display: grid; gap: 18px; }
  .dashboard-card { overflow: hidden; background: white; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 32px rgba(0,72,101,.05); }
  .dashboard-card > header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 20px 15px; border-bottom: 1px solid var(--line); }
  .dashboard-card > header h2 { margin: 0; font-size: 18px; letter-spacing: -.012em; }
  .dashboard-card > header p { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
  .panel-count { min-width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; color: var(--danger); background: var(--danger-soft); font-size: 13px; font-variant-numeric: tabular-nums; }
  .operations-table { min-width: 660px; table-layout: fixed; }
  .operations-table thead th:first-child,.operations-table tbody th { width: 34%; }
  .operations-table thead th:not(:first-child),.operations-table tbody td { width: 22%; }
  .operations-table thead th { padding: 12px 16px; color: #4a626d; background: #f7fafb; font-size: 12px; text-align: left; }
  .operations-table thead th:not(:first-child) { text-align: center; }
  .operations-table tbody th { width: 34%; padding: 15px 16px; background: white; color: var(--ink); font-size: 14px; font-weight: 750; }
  .operations-table tbody th strong,.operations-table tbody th span { display: block; }
  .operations-table tbody th span { margin-top: 3px; color: var(--muted); font-size: 10px; font-weight: 650; letter-spacing: .04em; }
  .operations-table tbody td { padding: 15px 10px; text-align: center; vertical-align: middle; }
  .operation-status {
    width: 126px; margin: 0 auto; display: grid; grid-template-columns: 25px minmax(0,1fr); align-items: center; gap: 7px;
    color: #506872; font-size: 12px; font-weight: 700; text-align: left; white-space: nowrap;
  }
  .operation-status i { width: 25px; height: 25px; display: grid; place-items: center; font-style: normal; line-height: 1; }
  .operation-status i .status-symbol { width: 25px; height: 25px; }
  .operation-status.done { color: var(--success); }
  .operation-status.finding { color: var(--danger); }
  .operation-status.pending { color: var(--warning); }
  .operation-status.neutral { color: #7a8d95; }
  .status-legend { display: flex; flex-wrap: wrap; gap: 16px; padding: 13px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
  .status-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .status-legend .status-symbol { width: 16px; height: 16px; }
  .status-legend .done { color: var(--success); }
  .status-legend .pending { color: var(--warning); }
  .status-legend .finding { color: var(--danger); }

  /* Admin workspace — sidebar shell inspired by the supplied PLN reference. */
  .admin-app-shell {
    width: 100%; max-width: 100%; min-width: 0; overflow-x: hidden;
    min-height: 100dvh;
    display: grid;
    grid-template-columns: 248px minmax(0, 1fr);
    background: #f1f5f7;
    transition: grid-template-columns .22s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .admin-sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 248px;
    height: 100dvh;
    min-height: 100dvh;
    z-index: 22;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    overflow-y: auto;
    padding: 24px 18px 18px;
    color: #eaf6fa;
    background:
      radial-gradient(ellipse at 18% 8%, rgba(22,137,181,.2) 0%, transparent 42%),

      linear-gradient(155deg, #061b29 0%, #08283d 42%, #0a334c 72%, #09283c 100%);
    box-shadow: 12px 0 38px rgba(3,31,46,.12);

    padding: 10px 12px;
    border: 1px solid transparent; border-radius: 10px;
    color: #c9dce5; background: transparent;

  .admin-side-link.active .admin-nav-icon { color: var(--pln-yellow); }

  .admin-command-user strong,.admin-command-user span { display: block; }

  body.presentation-active .admin-page .dashboard-hero > div:first-child { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px 18px; }

    .room-status-toolbar { align-items: stretch; flex-direction: column; }

  @media (max-width: 620px) {

    .admin-command-user .presentation-toggle span,.admin-command-user .admin-refresh-button span { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  @media print {
    body { background: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body * { visibility: hidden !important; }
    #qr-print-area, #qr-print-area * { visibility: visible !important; }
    #qr-print-area { position: absolute; inset: 0; padding: 0; }
    #qr-print-area .qr-grid { display: block; padding: 0; }
    #qr-print-area .qr-card { width: 180mm; min-height: 250mm; margin: 0 auto; padding: 25mm 20mm; border-width: 4px; page-break-after: always; border-radius: 0; }
    #qr-print-area .qr-card:last-child { page-break-after: auto; }
    #qr-print-area .qr-card-actions { display: none !important; }
    #qr-print-area .qr-logo { width: 200px; height: 75px; }
    #qr-print-area .qr-code { width: 115mm; height: 115mm; }
    #qr-print-area .qr-code img, #qr-print-area .qr-code canvas { width: 115mm !important; height: 115mm !important; image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges; image-rendering: pixelated; }
    #qr-print-area .qr-card h2 { font-size: 34px; }
    #qr-print-area .qr-card p { font-size: 18px; }
    #qr-print-area .scan-label { font-size: 22px; margin-top: 24px; }
  }

  /* ── Satisfaction Sub-Tabs ── */
  .satisfaction-subtabs {
    display: flex; gap: 4px;
    padding: 0 0 20px 0;
    border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
  }
  .satisfaction-subtab {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 18px; border-radius: var(--radius-control);
    border: 1.5px solid var(--line); background: var(--surface);
    color: var(--muted); font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all .15s;
  }
  .satisfaction-subtab svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .satisfaction-subtab.active {
    background: var(--pln-blue); color: #fff; border-color: var(--pln-blue);
  }
  .satisfaction-subtab.active svg { stroke: #fff; fill: rgba(255,255,255,.18); }
  .satisfaction-subtab:hover:not(.active) { border-color: var(--pln-blue); color: var(--pln-blue); background: var(--pln-blue-soft); }

  /* ── Presentation Tabs Switcher ── */
  .presentation-tabs-container {
    display: flex; justify-content: flex-start; margin: -10px 0 22px 0;
  }
  .presentation-tabs {
    display: inline-flex; gap: 6px; padding: 5px;
    border-radius: 12px; background: rgba(255,255,255,.9);
    border: 1px solid #d9e4e9; box-shadow: 0 4px 14px rgba(0,0,0,.04);
  }
  .presentation-tab {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 18px; border-radius: 8px;
    border: none; background: transparent; color: var(--muted);
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all .15s ease;
  }
  .presentation-tab svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .presentation-tab:hover:not(.active) { color: var(--ink); background: rgba(0,118,168,.06); }
  .presentation-tab.active { background: var(--pln-blue); color: #fff; box-shadow: 0 2px 8px rgba(0,118,168,.3); }

  /* ── Officer Performance Modern Charts ── */
  .officer-charts-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }
  .officer-chart-card .panel-body { padding: 18px 22px 24px; }
  .officer-bars-list { display: flex; flex-direction: column; gap: 18px; }
  .officer-bar-row { display: flex; flex-direction: column; gap: 8px; }
  .officer-bar-info { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .officer-bar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .officer-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--pln-blue-soft); color: var(--pln-blue-dark);
    font-size: 13px; font-weight: 700; display: grid; place-items: center;
    flex-shrink: 0; border: 1.5px solid rgba(0, 118, 168, .2);
  }
  .officer-bar-name { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .officer-bar-name strong { font-size: 14px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .officer-bar-name span { font-size: 12px; color: var(--muted); }
  .officer-bar-stats { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .officer-vol-count { font-size: 13px; color: var(--ink); font-weight: 700; }
  .officer-rating-score { font-size: 13px; color: #b45309; font-weight: 700; }

  .clean-badge {
    display: inline-block; padding: 2px 8px; border-radius: 12px;
    font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .clean-badge-good { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
  .clean-badge-med { background: #fef9c3; color: #a16207; border: 1px solid #fef08a; }
  .clean-badge-warn { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }

  .officer-chart-track-container {
    position: relative; width: 100%; height: 22px;
    border-radius: 6px; background: #eef2f5; overflow: hidden;
  }
  .officer-grid-lines {
    position: absolute; inset: 0; pointer-events: none;
  }
  .officer-grid-lines .grid-line {
    position: absolute; top: 0; bottom: 0; width: 1px;
    background: rgba(0,0,0,.08); border-right: 1px dashed rgba(0,0,0,.08);
  }

  .officer-progress-track {
    position: relative; z-index: 2; width: 100%; height: 100%;
    display: flex; gap: 0;
  }
  .officer-progress-fill {
    height: 100%; transition: width .4s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .officer-progress-fill.clean { background: var(--pln-blue); }
  .officer-progress-fill.finding { background: #f0772a; }
  .officer-progress-fill.rating-fill { background: linear-gradient(90deg, #f59e0b, #0076a8); }
  .officer-progress-fill.empty-fill { background: #e2e8f0; }
  .officer-progress-fill.cov-high { background: var(--success); }
  .officer-progress-fill.cov-med { background: #eab308; }
  .officer-progress-fill.cov-low { background: var(--danger); }

  .bar-num-label {
    font-size: 11px; font-weight: 700; color: #fff;
    white-space: nowrap; padding: 0 6px;
    text-shadow: 0 1px 2px rgba(0,0,0,.3);
  }

  /* ── Sumbu X Axis Ticks & Scale ── */
  .officer-x-axis {
    margin-top: 14px; padding-top: 6px;
    border-top: 1.5px solid #cbd5e1;
    position: relative;
  }
  .officer-x-ticks {
    position: relative; width: 100%; height: 20px;
  }
  .officer-x-ticks .x-tick {
    position: absolute; top: 0; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center;
  }
  .officer-x-ticks .x-tick:first-child { transform: translateX(0); align-items: flex-start; }
  .officer-x-ticks .x-tick:last-child { transform: translateX(-100%); align-items: flex-end; }
  .officer-x-ticks .x-tick i {
    display: block; width: 1px; height: 5px; background: #94a3b8; margin-top: -6px;
  }
  .officer-x-ticks .x-tick em {
    font-style: normal; font-size: 10px; font-weight: 600; color: #64748b; margin-top: 2px;
  }
  .officer-x-axis-label {
    text-align: center; font-size: 10px; font-weight: 700;
    color: #64748b; text-transform: uppercase; letter-spacing: .6px;
    margin-top: 4px;
  }

  .rating-chip-na {
    display: inline-block; padding: 2px 8px; border-radius: 12px;
    background: var(--canvas); color: var(--muted); font-size: 11px;
  }

  .officer-chart-legend {
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    font-size: 12px; color: var(--muted);
  }
  .officer-chart-legend i {
    display: inline-block; width: 12px; height: 12px;
    border-radius: 3px; vertical-align: middle; margin-right: 5px;
  }
  .officer-chart-legend i.clean { background: var(--pln-blue); }
  .officer-chart-legend i.finding { background: #f0772a; }

  /* ── Multi-session room coverage grid ── */
  .officer-room-cov-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
    max-height: 480px;
    overflow-y: auto;
  }
  .officer-room-cov-item {
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface-soft); display: flex; flex-direction: column; gap: 6px;
  }
  .officer-room-cov-info { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .officer-room-cov-info strong { font-size: 13px; color: var(--ink); }
  .officer-room-cov-stat { font-size: 12px; color: var(--muted); }
  .officer-room-cov-stat strong { color: var(--pln-blue-dark); font-size: 13px; }
  .officer-room-slots-hint { font-size: 11px; color: var(--muted); }
  .officer-badge-sm {
    display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 10px;
    background: #e0f2fe; color: var(--pln-blue-dark); font-weight: 500;
  }

  /* ── Officer Clean Rate Bar (table) ── */
  .officer-clean-rate-bar {
    display: flex; align-items: center; gap: 8px; min-width: 80px;
  }
  .officer-clean-rate-bar i {
    display: block; height: 7px; border-radius: 4px;
    background: var(--pln-blue); flex-shrink: 0; max-width: 80px;
    transition: width .3s;
  }
  .officer-clean-rate-bar span { font-size: 12px; color: var(--muted); white-space: nowrap; }

  /* ── Officer table numeric cells + metric grid ── */
  .officer-metric-grid { margin-bottom: 20px; }
  .officer-metric-danger { border-left: 3px solid var(--danger); }
  td.num, th.num { text-align: right; }

  /* ── Officer time badge ── */
  .officer-time-badge {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 7px; border-radius: 20px; font-size: 11px; font-weight: 500;
  }
  .officer-time-badge.morning { background: #fff8e1; color: #9a6500; }
  .officer-time-badge.afternoon { background: #e3f2fd; color: #0055a5; }

  /* ── Officer badge (chips inside header) ── */
  .officer-badge {
    display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px;
    background: var(--canvas); color: var(--muted); border: 1px solid var(--line);
    font-weight: 500;
  }
  .officer-badge-cov { background: #e7f6ef; color: var(--success); border-color: var(--success-soft); }
  .officer-badge-warn { background: var(--warning-soft); color: var(--warning); border-color: #f5e0a0; }
  .officer-badge-ok { background: var(--success-soft); color: var(--success); border-color: var(--success-soft); }
  .officer-badge-star { background: #fef3c7; color: #b45309; border-color: #fde68a; font-weight: 600; }

  /* ── Officer detail accordion ── */
  .officer-cards-list { display: flex; flex-direction: column; gap: 12px; }
  .officer-detail-card { border: 1px solid var(--line); border-radius: var(--radius-card); overflow: hidden; padding: 0 !important; margin: 0; }
  .officer-detail-header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 20px; cursor: pointer; user-select: none;
    transition: background .12s;
  }
  .officer-detail-header:hover { background: var(--surface-soft); }
  .officer-detail-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .officer-detail-title strong { font-size: 15px; }
  .officer-detail-chevron {
    width: 20px; height: 20px; flex-shrink: 0;
    stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    transition: transform .2s;
  }
  .officer-detail-body { display: none; border-top: 1px solid var(--line); }
  .officer-detail-body.open { display: block; }
  .officer-detail-section { padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .officer-detail-section:last-child { border-bottom: none; }
  .officer-detail-section h4 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .officer-kpi-row { display: flex; gap: 20px; flex-wrap: wrap; }
  .officer-kpi-row > div { display: flex; flex-direction: column; gap: 2px; min-width: 100px; }
  .officer-kpi-row > div span { font-size: 12px; color: var(--muted); }
  .officer-kpi-row > div strong { font-size: 22px; font-weight: 700; color: var(--ink); }

  /* ── Officer uncovered tags ── */
  .officer-uncovered-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .officer-uncovered-tag {
    padding: 4px 12px; border-radius: 20px; font-size: 13px;
    background: var(--warning-soft); color: var(--warning); border: 1px solid #f5e0a0;
  }

  /* ── Global uncovered rooms panel ── */
  .officer-uncovered-panel .export-format.danger { background: var(--danger-soft); color: var(--danger); border: 1px solid #f9c8c5; border-radius: 8px; padding: 3px 10px; }
  .officer-uncovered-grid { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 20px; }
  .officer-uncovered-item {
    padding: 10px 16px; border-radius: 10px;
    background: var(--danger-soft); border: 1px solid #f9c8c5; color: var(--danger);
  }
  .officer-covered-ok .panel-body { padding: 16px 20px; }
  .officer-ok-notice {
    font-size: 15px; font-weight: 500; color: var(--success);
    padding: 12px 20px; background: var(--success-soft); border-radius: 10px;
  }

  /* ── Coverage matrix heatmap ── */
