<style>
  :root {
    --pln-blue: #0076a8;
    --pln-blue-dark: #00577d;
    --pln-blue-soft: #e8f5fa;
    --pln-yellow: #ffd100;
    --pln-red: #e42313;
    --ink: #17313d;
    --muted: #647783;
    --line: #d9e4e9;
    --surface: #ffffff;
    --canvas: #f3f7f9;
    --success: #157a55;
    --success-soft: #e7f6ef;
    --danger: #bd2d22;
    --danger-soft: #fff0ee;
    --warning: #9a6500;
    --warning-soft: #fff7d6;
    --radius-card: 16px;
    --radius-control: 10px;
    --shadow: 0 14px 36px rgba(0, 72, 101, .10);
  }

  * { box-sizing: border-box; }
  html { background: var(--canvas); color: var(--ink); font-family: "Segoe UI", Arial, sans-serif; }
  body { margin: 0; min-width: 320px; min-height: 100dvh; }
  button, input, textarea, select { font: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .58; }
  img { max-width: 100%; }
  a { color: var(--pln-blue-dark); }
  .hidden { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  .app-shell { min-height: 100dvh; }
  .initial-loader { min-height: 100dvh; display: grid; place-content: center; gap: 14px; width: min(360px, calc(100% - 48px)); margin: auto; }
  .brand-mark { width: 156px; height: 64px; display: grid; align-items: center; }
  .brand-mark img { width: 150px; max-height: 58px; object-fit: contain; object-position: left center; }
  .skeleton-line { height: 14px; width: 72%; border-radius: 6px; background: linear-gradient(90deg,#e1e9ed,#f7fafb,#e1e9ed); background-size: 220% 100%; animation: shimmer 1.2s linear infinite; }
  .skeleton-line.wide { width: 100%; height: 22px; }
  @keyframes shimmer { to { background-position: -220% 0; } }

  .login-layout { min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(380px, .95fr); }
  .login-brand { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: clamp(34px, 6vw, 80px); color: white; background: var(--pln-blue-dark); }
  .login-brand::before { content: ""; position: absolute; width: 440px; height: 440px; right: -170px; bottom: -190px; border: 84px solid rgba(255,209,0,.95); border-radius: 50%; }
  .login-brand::after { content: ""; position: absolute; width: 170px; height: 170px; right: 80px; top: 60px; border: 2px solid rgba(255,255,255,.22); transform: rotate(18deg); }
  .login-brand > * { position: relative; z-index: 1; }
  .login-brand .brand-mark { background: white; border-radius: 12px; padding: 10px 14px; width: 174px; }
  .login-copy { max-width: 600px; }
  .login-copy h1 { margin: 0 0 18px; font-size: clamp(38px, 5.3vw, 72px); line-height: .98; letter-spacing: -.045em; max-width: 11ch; }
  .login-copy p { margin: 0; max-width: 42ch; font-size: 18px; line-height: 1.55; color: rgba(255,255,255,.8); }
  .room-chip { align-self: flex-start; padding: 10px 14px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); border-radius: 999px; font-weight: 700; }
  .login-panel { display: grid; place-items: center; padding: 32px; background: var(--surface); }
  .login-card { width: min(430px, 100%); }
  .login-card h2 { font-size: 30px; margin: 0 0 8px; letter-spacing: -.02em; }
  .login-card > p { margin: 0 0 30px; color: var(--muted); line-height: 1.55; }

  .field { display: grid; gap: 7px; margin-bottom: 18px; }
  .field label, .field-label { font-size: 14px; font-weight: 700; color: #304b57; }
  .field input, .field textarea, .field select {
    width: 100%; min-height: 48px; border: 1px solid #b9cbd3; border-radius: var(--radius-control); background: white; color: var(--ink); padding: 11px 13px; outline: none;
  }
  .field textarea { resize: vertical; min-height: 92px; }
  .field select, .filter-control select {
    appearance: none;
    padding-right: 44px;
    background-image:
      linear-gradient(45deg, transparent 50%, #56707b 50%),
      linear-gradient(135deg, #56707b 50%, transparent 50%);
    background-position:
      calc(100% - 19px) calc(50% - 2px),
      calc(100% - 14px) calc(50% - 2px);
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--pln-blue); box-shadow: 0 0 0 3px rgba(0,118,168,.15); }
  .field-hint { color: var(--muted); font-size: 12px; line-height: 1.45; }
  .form-error { padding: 12px 14px; border-left: 4px solid var(--danger); background: var(--danger-soft); color: #872018; margin-bottom: 16px; border-radius: 6px; }
  .required { color: var(--danger); }

  .btn { min-height: 44px; border: 1px solid transparent; border-radius: var(--radius-control); padding: 10px 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 750; line-height: 1.2; transition: transform .12s ease, background .16s ease, border-color .16s ease; }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--pln-blue); color: white; }
  .btn-primary:hover { background: var(--pln-blue-dark); }
  .btn-secondary { background: white; color: var(--pln-blue-dark); border-color: #a9c2cd; }
  .btn-secondary:hover { background: var(--pln-blue-soft); }
  .btn-danger { background: var(--danger-soft); color: var(--danger); border-color: #efb9b3; }
  .btn-quiet { background: transparent; color: var(--pln-blue-dark); border-color: transparent; }
  .btn-block { width: 100%; }
  .btn-sm { min-height: 36px; padding: 7px 11px; font-size: 13px; }

  .topbar { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line); }
  .topbar-inner { max-width: 1240px; min-height: 72px; margin: auto; padding: 10px 22px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .topbar-brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .topbar-brand img { width: 104px; max-height: 40px; object-fit: contain; }
  .brand-divider { width: 1px; height: 34px; background: var(--line); }
  .topbar-title { min-width: 0; }
  .topbar-title strong, .topbar-title span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar-title span { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .user-area { display: flex; align-items: center; gap: 12px; }
  .user-copy { text-align: right; }
  .user-copy strong, .user-copy span { display: block; }
  .user-copy span { color: var(--muted); font-size: 12px; margin-top: 2px; }

  .page { max-width: 1240px; margin: auto; padding: 32px 22px 60px; }
  .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 22px; margin-bottom: 26px; }
  .page-heading h1 { margin: 0; font-size: clamp(28px, 4vw, 44px); letter-spacing: -.035em; line-height: 1.06; }
  .page-heading p { margin: 9px 0 0; color: var(--muted); line-height: 1.5; }
  .eyebrow { color: var(--pln-blue-dark); font-size: 13px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 8px; }

  .room-banner { display: grid; grid-template-columns: 1fr auto; gap: 20px; background: var(--pln-blue-dark); color: white; border-radius: var(--radius-card); padding: 24px; margin-bottom: 22px; box-shadow: var(--shadow); }
  .room-banner h1 { margin: 0; font-size: clamp(27px, 5vw, 42px); letter-spacing: -.03em; }
  .room-banner p { color: rgba(255,255,255,.74); margin: 8px 0 0; }
  .scan-box { align-self: center; border-left: 1px solid rgba(255,255,255,.2); padding-left: 24px; min-width: 180px; }
  .scan-box span, .scan-box strong { display: block; }
  .scan-box span { color: rgba(255,255,255,.7); font-size: 12px; margin-bottom: 5px; }

  .notice { padding: 14px 16px; border-radius: var(--radius-control); margin-bottom: 20px; line-height: 1.5; }
  .notice-warning { background: var(--warning-soft); color: #725000; border-left: 4px solid var(--pln-yellow); }
  .notice-success { background: var(--success-soft); color: #0f5e40; border-left: 4px solid var(--success); }
  .notice-danger { background: var(--danger-soft); color: #872018; border-left: 4px solid var(--danger); }

  .checklist { display: grid; gap: 14px; }
  .activity-card { background: white; border: 1px solid var(--line); border-radius: var(--radius-card); padding: 20px; }
  .activity-head { display: grid; grid-template-columns: 40px 1fr; align-items: center; gap: 14px; }
  .activity-number { width: 38px; height: 38px; display: grid; place-items: center; background: var(--pln-blue-soft); color: var(--pln-blue-dark); border-radius: 10px; font-weight: 850; }
  .activity-name { font-weight: 760; line-height: 1.42; }
  .activity-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 16px; }
  .choice-row { display: grid; gap: 6px; }
  .choice-label { font-size: 13px; font-weight: 700; color: #304b57; }
  .choice-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .choice { position: relative; }
  .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .choice label { display: flex; min-height: 44px; justify-content: center; align-items: center; border: 1px solid #b9cbd3; border-radius: var(--radius-control); font-size: 14px; font-weight: 750; background: white; }
  .choice input:focus + label { box-shadow: 0 0 0 3px rgba(0,118,168,.16); }
  .choice.clean input:checked + label { border-color: var(--success); color: var(--success); background: var(--success-soft); }
  .choice.dirty input:checked + label { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }
  .finding-fields { display: none; grid-template-columns: 1fr 1fr; gap: 14px; padding-top: 18px; margin-top: 18px; border-top: 1px solid var(--line); }
  .activity-card.is-dirty .finding-fields { display: grid; }
  .finding-fields .field { margin: 0; }
  .file-control { border: 1px dashed #9fb6c0; padding: 12px; border-radius: var(--radius-control); background: #f9fbfc; }
  .file-control input { min-height: auto; border: 0; padding: 0; box-shadow: none; }
  .photo-preview { display: none; margin-top: 10px; width: 120px; height: 92px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  .photo-preview.has-image { display: block; }
  .submit-bar { position: sticky; bottom: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 20px; background: rgba(255,255,255,.97); border: 1px solid var(--line); border-radius: var(--radius-card); padding: 14px 16px; margin-top: 20px; box-shadow: 0 -8px 28px rgba(0,72,101,.09); }
  .submit-bar p { margin: 0; color: var(--muted); font-size: 13px; }

  .admin-tabs { display: flex; gap: 6px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 3px; }
  .admin-tab { white-space: nowrap; min-height: 42px; border: 0; padding: 9px 15px; border-radius: var(--radius-control); color: #4e6671; background: transparent; font-weight: 750; }
  .admin-tab.active { color: white; background: var(--pln-blue); }
  .admin-nav { position: sticky; top: 72px; z-index: 18; background: rgba(255,255,255,.97); border-bottom: 1px solid var(--line); }
  .admin-nav-inner { max-width: 1240px; margin: auto; padding: 0 22px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .admin-nav-inner::-webkit-scrollbar { display: none; }
  .admin-nav button {
    appearance: none; position: relative; flex: 0 0 auto; min-height: 50px; padding: 0 14px;
    border: 0; border-radius: 0; background: transparent; color: #536b76; font-weight: 750;
    white-space: nowrap; transition: color .16s ease, background .16s ease;
  }
  .admin-nav button:hover { color: var(--pln-blue-dark); background: #f6fafb; }
  .admin-nav button.active { color: var(--pln-blue-dark); background: var(--pln-blue-soft); }
  .admin-nav button.active::after {
    content: ""; position: absolute; left: 14px; right: 14px; bottom: 0; height: 3px;
    background: var(--pln-blue); border-radius: 3px 3px 0 0;
  }
  .metric-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 24px; }
  .metric { background: white; border: 1px solid var(--line); border-radius: var(--radius-card); padding: 20px; min-height: 132px; display: flex; flex-direction: column; justify-content: space-between; }
  .metric span { color: var(--muted); font-size: 13px; }
  .metric strong { font-size: 38px; letter-spacing: -.04em; line-height: 1; }
  .metric.attention { border-top: 5px solid var(--pln-yellow); }
  .metric.danger { border-top: 5px solid var(--pln-red); }
  .metric.success { border-top: 5px solid var(--success); }
  .panel { background: white; border: 1px solid var(--line); border-radius: var(--radius-card); margin-bottom: 20px; overflow: hidden; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
  .panel-head h2 { margin: 0; font-size: 19px; }
  .panel-body { padding: 20px; }
  .export-heading { align-items: flex-start; margin-bottom: 22px; }
  .export-heading h1 { font-size: clamp(30px, 4vw, 42px); }
  .export-panel { box-shadow: 0 16px 44px rgba(0,72,101,.07); }
  .export-format {
    display: inline-flex; align-items: center; min-height: 30px; padding: 5px 10px;
    border: 1px solid #b7d3de; border-radius: 7px; color: var(--pln-blue-dark);
    background: var(--pln-blue-soft); font-size: 12px; font-weight: 850; letter-spacing: .06em;
  }
  .export-form { min-width: 0; }
  .export-form .form-grid { align-items: start; }
  .export-form .field { margin-bottom: 0; }
  .export-summary {
    display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 18px;
    margin: 4px 0 18px; padding: 14px 16px; border: 1px solid var(--line);
    border-radius: 10px; background: #f8fbfc; color: #304b57;
  }
  .export-summary > strong { font-size: 14px; }
  .export-summary ul { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; margin: 0; padding: 0; list-style: none; }
  .export-summary li { position: relative; padding-left: 21px; color: var(--muted); font-size: 12px; line-height: 1.4; }
  .export-summary li::before { content: "✓"; position: absolute; left: 0; color: var(--success); font-weight: 900; }
  .export-action { width: 100%; min-height: 50px; }
  .export-progress { margin: 2px 0 18px; padding: 14px; border: 1px solid #cde1e9; border-radius: 10px; background: #f7fbfc; }
  .export-progress-copy { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 9px; font-size: 13px; color: #3d5661; }
  .export-progress-copy strong { color: var(--pln-blue-dark); }
  .export-progress-track { height: 8px; overflow: hidden; border-radius: 5px; background: #dce9ee; }
  .export-progress-bar { width: 0; height: 100%; background: var(--pln-blue); transition: width .35s ease; }
  .export-progress-bar.failed { background: var(--danger); }
  .status-list { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
  .status-item { border: 1px solid var(--line); border-radius: 12px; padding: 15px; }
  .status-item strong, .status-item span { display: block; }
  .status-item span { color: var(--muted); font-size: 12px; margin-top: 5px; }
  .badge { display: inline-flex; align-items: center; min-height: 28px; padding: 5px 9px; border-radius: 999px; font-size: 12px; font-weight: 800; white-space: nowrap; }
  .badge-clean { color: var(--success); background: var(--success-soft); }
  .badge-dirty { color: var(--danger); background: var(--danger-soft); }
  .badge-pending { color: var(--warning); background: var(--warning-soft); }
  .badge-neutral { color: #526973; background: #edf2f4; }

  .table-wrap { width: 100%; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 680px; }
  th, td { padding: 13px 14px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 14px; }
  th { color: #526973; font-size: 12px; letter-spacing: .03em; background: #f8fafb; }
  tbody tr:last-child td { border-bottom: 0; }
  .table-actions { display: flex; flex-wrap: wrap; gap: 7px; }
  .empty { text-align: center; color: var(--muted); padding: 36px 20px; line-height: 1.55; }

  .management-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 18px; }
  .management-list { display: grid; gap: 9px; }
  .management-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--line); border-radius: 11px; padding: 12px; }
  .management-item strong, .management-item span { display: block; }
  .management-item span { color: var(--muted); font-size: 12px; margin-top: 3px; }

  .qr-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .qr-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 18px; padding-top: 18px; }
  .qr-card { background: white; border: 2px solid var(--pln-blue); border-radius: var(--radius-card); padding: 18px; text-align: center; break-inside: avoid; }
  .qr-card .qr-logo { width: 120px; height: 44px; object-fit: contain; margin-bottom: 12px; }
  .qr-code { width: 196px; height: 196px; margin: 10px auto; display: grid; place-items: center; }
  .qr-code img, .qr-code canvas { max-width: 100%; height: auto !important; }
  .qr-card h2 { margin: 12px 0 4px; color: var(--pln-blue-dark); }
  .qr-card p { margin: 0; color: var(--muted); font-size: 12px; }
  .qr-card .scan-label { background: var(--pln-yellow); color: #3c3400; padding: 8px; margin: 14px -18px -18px; border-radius: 0 0 13px 13px; font-weight: 850; }

  .modal-backdrop { position: fixed; inset: 0; z-index: 100; background: rgba(13,39,50,.58); display: grid; place-items: center; padding: 20px; }
  .modal { width: min(620px,100%); max-height: min(820px,calc(100dvh - 40px)); overflow: auto; background: white; border-radius: var(--radius-card); box-shadow: 0 28px 90px rgba(0,30,45,.3); }
  .modal-head { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; gap: 16px; background: white; padding: 18px 20px; border-bottom: 1px solid var(--line); }
  .modal-head h2 { margin: 0; font-size: 20px; }
  .modal-close { width: 38px; height: 38px; border: 1px solid var(--line); background: white; border-radius: 10px; font-size: 22px; line-height: 1; color: var(--muted); }
  .modal-body { padding: 20px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--line); }
  .checkbox-list { display: grid; gap: 8px; max-height: 320px; overflow: auto; }
  .checkbox-row { display: flex; align-items: flex-start; gap: 10px; padding: 11px; border: 1px solid var(--line); border-radius: 10px; }
  .checkbox-row input { width: 18px; height: 18px; margin-top: 2px; }
  .photo-dialog { width: min(820px, 100%); }
  .photo-dialog img { display: block; width: 100%; max-height: 70dvh; object-fit: contain; background: #edf2f4; }

  .toast-region { position: fixed; right: 18px; bottom: 18px; z-index: 200; display: grid; gap: 10px; width: min(380px,calc(100% - 36px)); }
  .toast { background: #17313d; color: white; padding: 14px 16px; border-radius: 11px; box-shadow: 0 14px 36px rgba(0,25,36,.26); animation: toast-in .2s ease-out; }
  .toast.error { background: #8d241c; }
  .toast.success { background: #0f6948; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

  @media (max-width: 900px) {
    .login-layout { grid-template-columns: 1fr; }
    .login-brand { min-height: 330px; padding: 34px 26px; }
    .login-copy h1 { font-size: 44px; }
    .login-panel { padding: 34px 22px 50px; }
    .metric-grid { grid-template-columns: repeat(2,1fr); }
    .management-grid { grid-template-columns: 1fr; }
    .qr-grid { grid-template-columns: repeat(2,1fr); }
    .activity-head { grid-template-columns: 40px 1fr; }
    .choice-group { grid-column: 1 / -1; }
    .status-list { grid-template-columns: 1fr 1fr; }
    .export-summary { grid-template-columns: 1fr; gap: 10px; }
  }

  @media (max-width: 620px) {
    .activity-choices { grid-template-columns: 1fr; gap: 14px; }
    .topbar-inner { min-height: 64px; padding: 9px 14px; }
    .topbar-brand img { width: 82px; }
    .brand-divider, .user-copy { display: none; }
    .topbar-title strong { font-size: 13px; max-width: 150px; }
    .admin-nav { top: 64px; }
    .admin-nav-inner { padding: 0 10px; }
    .admin-nav button { min-height: 46px; padding: 0 11px; font-size: 13px; }
    .page { padding: 24px 14px 44px; }
    .page-heading { align-items: flex-start; flex-direction: column; }
    .room-banner { grid-template-columns: 1fr; padding: 20px; }
    .scan-box { border-left: 0; border-top: 1px solid rgba(255,255,255,.2); padding: 14px 0 0; }
    .activity-card { padding: 16px; }
    .finding-fields { grid-template-columns: 1fr; }
    .submit-bar { align-items: stretch; flex-direction: column; }
    .metric-grid { gap: 10px; }
    .metric { min-height: 116px; padding: 16px; }
    .metric strong { font-size: 32px; }
    .status-list { grid-template-columns: 1fr; }
    .panel-head { align-items: flex-start; flex-direction: column; }
    .qr-grid { grid-template-columns: 1fr; }
    .modal-backdrop { padding: 0; align-items: end; }
    .modal { max-height: 92dvh; border-radius: 16px 16px 0 0; }
    .login-brand::after { display: none; }
    .login-brand::before { right: -270px; bottom: -260px; }
  }

  .camera-frame {
    overflow: hidden;
    width: 100%;
    min-height: 260px;
    border-radius: 14px;
    background: #081d27;
    display: grid;
    place-items: center;
  }
  .camera-frame video {
    display: block;
    width: 100%;
    max-height: 62dvh;
    object-fit: cover;
  }
  .camera-fallback { margin-top: 14px; }
  .capture-input {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
