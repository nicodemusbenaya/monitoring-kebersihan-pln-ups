              '<div><span>Avg Ruangan/Hari</span><strong>' + officer.avgRoomsPerActiveDay + '</strong></div>' +
            '</div>' +
          '</div>' +
          '<div class="officer-detail-section">' +
            '<h4>Histori Evaluasi Anonim yang Masuk (' + (officer.evaluations || []).length + ')</h4>' +
            '<div class="table-wrap"><table><thead><tr><th>Waktu</th><th>Ruangan</th><th>Rating</th><th>Aspek</th><th>Komentar</th></tr></thead><tbody>' + (evalRows || '<tr><td colspan="5" class="empty">Belum ada evaluasi anonim untuk petugas ini pada periode terpilih.</td></tr>') + '</tbody></table></div>' +
          '</div>' +
          '<div class="officer-detail-section">' +
            '<h4>Ruangan yang dikerjakan (' + officer.roomDetails.length + ')</h4>' +
            '<div class="table-wrap"><table><thead><tr><th>Ruangan</th><th class="num">Inspeksi</th><th class="num">Bersih</th><th class="num">Temuan</th><th>Tingkat bersih</th><th class="num">Frekuensi kunjungan</th></tr></thead><tbody>' + (roomRows || '<tr><td colspan="6" class="empty">—</td></tr>') + '</tbody></table></div>' +
          '</div>' +
          '<div class="officer-detail-section">' +
            '<h4>Ruangan tidak tercover (' + officer.roomsNotCovered.length + ')</h4>' +
            '<div class="officer-uncovered-list">' + uncoveredList + '</div>' +
          '</div>' +
        '</div>' +
        '</article>';
    }).join('');

    // ── 7. Coverage matrix (Heatmap) ──
    var matrixHeaders = '<th>Ruangan</th>' + officers.map(function(o) {
      return '<th class="matrix-officer-head">' + esc(o.officerName.split(' ')[0]) + '</th>';
    }).join('') + '<th class="num">Total</th>';
    var matrixRows = matrixRooms.map(function(room) {
      var cells = officers.map(function(o) {
        var count = room.counts[o.userId] || 0;
        var intensity = room.total ? Math.min(1, count / Math.max(1, room.total)) : 0;
        var alpha = count ? (0.12 + intensity * 0.75).toFixed(2) : '0';
        return '<td class="matrix-cell" style="background:rgba(0,118,168,' + alpha + ')" title="' + esc(o.officerName) + ' · ' + esc(room.roomName) + ': ' + count + 'x">' + (count || '') + '</td>';
      }).join('');
      var totalClass = room.total === 0 ? ' matrix-row-zero' : '';
      return '<tr class="' + totalClass + '"><td>' + esc(room.roomName) + '</td>' + cells + '<td class="num"><strong>' + room.total + '</strong></td></tr>';
    }).join('');

    // ── 8. Global Uncovered Panel ──
    var uncoveredSection = uncoveredRooms.length
      ? '<section class="panel officer-uncovered-panel"><div class="panel-head"><div><h2>⚠ Ruangan tanpa monitoring di periode ini</h2><div class="field-hint">Ruangan aktif (tidak di-hidden) yang tidak ada satu pun petugas yang melakukan monitoring selama periode terpilih.</div></div><span class="export-format danger">' + uncoveredRooms.length + ' ruangan</span></div><div class="panel-body officer-uncovered-grid">' +
          uncoveredRooms.map(function(r) { return '<div class="officer-uncovered-item"><strong>' + esc(r.roomName) + '</strong></div>'; }).join('') +
          '</div></section>'
      : '<section class="panel officer-covered-ok"><div class="panel-body"><div class="officer-ok-notice">✓ Semua ruangan aktif mendapat monitoring di periode ini</div></div></section>';

    root.innerHTML = metricsHtml +
      '<section class="officer-charts-container">' +
        volumeChartCard +
        ratingChartCard +
      '</section>' +
      sessionCoverageCard +
      uncoveredSection +
      '<section class="panel satisfaction-history"><div class="panel-head"><div><h2>Statistik ringkasan</h2><div class="field-hint">Rating dihitung dari evaluasi anonim pengunjung untuk setiap petugas.</div></div></div>' +
      '<div class="table-wrap"><table><thead><tr>' +
      '<th>Petugas</th><th class="num">Total</th><th class="num">Bersih</th><th class="num">Temuan</th><th>Tingkat bersih</th><th class="num">Rating evaluasi</th><th class="num">Kepuasan eval</th><th class="num">Ruangan (coverage)</th><th class="num">Hari aktif</th><th class="num">Avg ruangan/hari</th>' +
      '</tr></thead><tbody>' + tableRows + '</tbody></table></div></section>' +
      '<section class="panel"><div class="panel-head"><div><h2>Detail per petugas</h2><div class="field-hint">Klik baris petugas untuk melihat breakdown ruangan, histori ulasan anonim yang diterima, dan ruangan tidak tercover.</div></div></div><div class="panel-body officer-cards-list">' + officerCards + '</div></section>' +
      '<section class="panel"><div class="panel-head"><div><h2>Coverage matrix</h2><div class="field-hint">Warna biru makin gelap = makin banyak inspeksi · Baris merah = nol monitoring.</div></div></div>' +
      '<div class="table-wrap"><table class="officer-matrix-table"><thead><tr>' + matrixHeaders + '</tr></thead><tbody>' + (matrixRows || '<tr><td colspan="99" class="empty">Tidak ada data.</td></tr>') + '</tbody></table></div></section>';
  }

  function toggleOfficerDetail_(cardId) {
    var body = document.getElementById(cardId);
    var chev = document.getElementById(cardId + '-chev');
    if (!body) return;
    var isOpen = body.classList.toggle('open');
    if (chev) chev.style.transform = isOpen ? 'rotate(180deg)' : '';
  }


  async function renderQr() {
    var root = document.getElementById('admin-content');
    if (state.qrData) return renderQrCards_(state.qrData, root);
    root.innerHTML = '<section class="panel"><div class="empty">Mempersiapkan QR...</div></section>';
    try {
      var rooms = await loadQrData_();
      if (state.adminTab !== 'qr' || root !== document.getElementById('admin-content')) return;
      renderQrCards_(rooms, root);
    } catch (error) {
      if (state.adminTab === 'qr' && root === document.getElementById('admin-content')) handleApiError(error);
    }
  }

  function renderQrCards_(rooms, root) {
    if (!root || state.adminTab !== 'qr') return;
    root.innerHTML = '<section class="panel"><div class="panel-head"><div><h2>QR Code ruangan HD</h2>' +
        '<div class="field-hint">Format HD A4 siap cetak dengan resolusi 1400x1400px &amp; Koreksi Kesalahan Tingkat Tinggi (Level H).</div></div>' +
        '<div class="qr-actions"><button class="btn btn-outline" onclick="downloadAllQrHd()">Unduh semua QR (HD)</button>' +
        '<button class="btn btn-primary" onclick="printQrCodes()">Cetak semua QR (A4 HD)</button>' +
        '<button class="btn btn-outline" onclick="downloadAllEvaluationQrHd()">Unduh semua evaluasi (HD)</button>' +
        '<button class="btn btn-primary" onclick="printEvaluationQrCodes()">Cetak semua evaluasi (A4 HD)</button></div></div><div class="panel-body"><div class="qr-grid">' +
        rooms.map(function(room, index) {
          return '<article class="qr-card"><img class="qr-logo" src="' + attr(state.bootstrap.app.logoUrl) +
            '" alt="PLN"><div class="qr-code" id="qr-' + index + '"></div><h2>' + esc(room.name) +
            '</h2><p>' + esc(room.code) + '</p><div class="qr-card-actions">' +
            '<button class="btn btn-sm btn-outline" onclick="downloadQrHd(' + index + ')">Unduh HD</button>' +
            '<button class="btn btn-sm btn-primary" onclick="printQrCodes(' + index + ')">Cetak HD</button></div>' +
            '<div class="scan-label">PINDAI DARI APLIKASI MONITORING</div>' +
            '<div class="qr-evaluation"><span>QR evaluasi anonim</span><div class="qr-evaluation-code" id="qr-eval-' + index + '"></div><div class="qr-card-actions">' +
            '<button class="btn btn-sm btn-outline" onclick="downloadEvaluationQrHd(' + index + ')">Unduh HD</button>' +
            '<button class="btn btn-sm btn-primary" onclick="printEvaluationQrCodes(' + index + ')">Cetak HD</button></div></div></article>';
        }).join('') + '</div></div></section>';
    rooms.forEach(function(room, index) {
      var target = document.getElementById('qr-' + index);
      if (!target || state.adminTab !== 'qr') return;
      if (state.qrImages[room.url]) {
        target.innerHTML = '<img src="' + attr(state.qrImages[room.url]) + '" alt="QR ' + attr(room.name) + '">';
      } else {
        new QRCode(target, {
          text: room.url, width: 1400, height: 1400,
          colorDark: '#001f2d', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H
        });
        var canvas = target.querySelector('canvas');
        if (canvas) state.qrImages[room.url] = canvas.toDataURL('image/png');
      }
      var evaluationTarget = document.getElementById('qr-eval-' + index);
      if (evaluationTarget && room.evaluationUrl) {
        if (state.qrImages[room.evaluationUrl]) {
          evaluationTarget.innerHTML = '<img src="' + attr(state.qrImages[room.evaluationUrl]) + '" alt="QR evaluasi ' + attr(room.name) + '">';
        } else {
          new QRCode(evaluationTarget, {
            text: room.evaluationUrl, width: 1400, height: 1400,
            colorDark: '#001f2d', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H
          });
          var evaluationCanvas = evaluationTarget.querySelector('canvas');
          if (evaluationCanvas) state.qrImages[room.evaluationUrl] = evaluationCanvas.toDataURL('image/png');
        }
      }
    });
  }

  function downloadQrHd(index) {
    if (!state.qrData || !state.qrData[index]) return toast('Data QR tidak ditemukan.', 'error');
    var room = state.qrData[index];
    var card = document.querySelectorAll('.qr-card')[index];
    if (!card) return toast('Elemen QR tidak ditemukan.', 'error');
    var sourceCanvas = card.querySelector('.qr-code canvas');
    var sourceImage = card.querySelector('.qr-code img');
    var qrData = sourceCanvas ? sourceCanvas.toDataURL('image/png') : (sourceImage ? sourceImage.src : (state.qrImages[room.url] || ''));
    if (!qrData) return toast('Gambar QR HD belum siap.', 'error');
    var a = document.createElement('a');
    a.href = qrData;
    a.download = 'QR_HD_' + (room.code || room.name).replace(/[^a-zA-Z0-9_-]/g, '_') + '.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    toast('QR HD untuk ' + room.name + ' berhasil diunduh.', 'success');
  }

  function downloadAllQrHd() {
    if (!state.qrData || !state.qrData.length) return toast('Data QR tidak ditemukan.', 'error');
    toast('Mengunduh ' + state.qrData.length + ' file QR HD...', 'info');
    state.qrData.forEach(function(room, index) {
      setTimeout(function() {
        downloadQrHd(index);
      }, index * 300);
    });
  }

  function downloadEvaluationQrHd(index) {
    if (!state.qrData || !state.qrData[index] || !state.qrData[index].evaluationUrl) return toast('Data QR evaluasi tidak ditemukan.', 'error');
    var room = state.qrData[index];
    var target = document.getElementById('qr-eval-' + index);
    var sourceCanvas = target && target.querySelector('canvas');
    var sourceImage = target && target.querySelector('img');
    var qrData = sourceCanvas ? sourceCanvas.toDataURL('image/png') : (sourceImage ? sourceImage.src : state.qrImages[room.evaluationUrl] || '');
    if (!qrData) return toast('Gambar QR evaluasi belum siap.', 'error');
    var link = document.createElement('a'); link.href = qrData;
    link.download = 'QR_EVALUASI_' + (room.code || room.name).replace(/[^a-zA-Z0-9_-]/g, '_') + '.png';
    document.body.appendChild(link); link.click(); link.remove();
    toast('QR evaluasi untuk ' + room.name + ' berhasil diunduh.', 'success');
  }

  function downloadAllEvaluationQrHd() {
    if (!state.qrData || !state.qrData.length) return toast('Data QR evaluasi tidak ditemukan.', 'error');
    toast('Mengunduh ' + state.qrData.length + ' file QR evaluasi HD...', 'info');
    state.qrData.forEach(function(room, index) {
      setTimeout(function() { downloadEvaluationQrHd(index); }, index * 300);
    });
  }

  function printEvaluationQrCodes(targetIndex) {
    if (!state.qrData || !state.qrData.length) return toast('Data QR evaluasi tidak ditemukan.', 'error');
    var indices = typeof targetIndex === 'number' && state.qrData[targetIndex]
      ? [targetIndex]
      : state.qrData.map(function(room, index) { return index; });
    var printableCards = indices.map(function(index) {
      var room = state.qrData[index];
      var target = document.getElementById('qr-eval-' + index);
      var sourceCanvas = target && target.querySelector('canvas');
      var sourceImage = target && target.querySelector('img');
      var qrData = sourceCanvas ? sourceCanvas.toDataURL('image/png') :
        (sourceImage ? sourceImage.src : state.qrImages[room.evaluationUrl] || '');
      if (!qrData) return '';
      return '<article class="qr-card"><img class="qr-logo" src="' + attr(state.bootstrap.app.logoUrl) +
        '" alt="PLN"><div class="qr-code"><img src="' + attr(qrData) + '" alt="QR evaluasi ' +
        attr(room.name) + '"></div><h2>' + esc(room.name) + '</h2><p>' + esc(room.code) +
        '</p><div class="scan-label">QR EVALUASI ANONIM</div></article>';
    }).filter(Boolean).join('');
    if (!printableCards) return toast('Gambar QR evaluasi belum siap.', 'error');
    return openQrPrintWindow_(printableCards, 'Cetak QR Evaluasi (A4 HD)');
  }

  function printQrCodes(targetIndex) {
    if (!state.qrData || !state.qrData.length) return toast('Data QR ruangan tidak ditemukan.', 'error');
    var cards = Array.prototype.slice.call(document.querySelectorAll('.qr-card'));
    var indices = typeof targetIndex === 'number' && state.qrData[targetIndex]
      ? [targetIndex]
      : state.qrData.map(function(room, index) { return index; });
    var printableCards = indices.map(function(index) {
      var room = state.qrData[index];
      var card = cards[index];
      if (!card) return '';
      var sourceCanvas = card.querySelector('.qr-code canvas');
      var sourceImage = card.querySelector('.qr-code img');
      var qrData = sourceCanvas ? sourceCanvas.toDataURL('image/png') :
        (sourceImage ? sourceImage.src : state.qrImages[room.url] || '');
      if (!qrData) return '';
      return '<article class="qr-card"><img class="qr-logo" src="' + attr(state.bootstrap.app.logoUrl) +
        '" alt="PLN"><div class="qr-code"><img src="' + attr(qrData) + '" alt="QR ruangan ' +
        attr(room.name) + '"></div><h2>' + esc(room.name) + '</h2><p>' + esc(room.code) +
        '</p><div class="scan-label">PINDAI DARI APLIKASI MONITORING</div></article>';
    }).filter(Boolean).join('');
    if (!printableCards) return toast('Gambar QR ruangan belum siap.', 'error');
    return openQrPrintWindow_(printableCards, 'Cetak QR Ruangan (A4 HD)');
  }

      return toast('Popup halaman cetak diblokir browser. Izinkan popup untuk aplikasi ini lalu coba lagi.', 'error');
    }

    printWindow.document.write(
      '<!doctype html><html><head><meta charset="utf-8"><title>' + title + '</title>' +
      '<style>' +
      '@page{size:A4 portrait;margin:10mm}' +

      '.qr-card{width:100%;min-height:270mm;display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px solid #0076a8;border-radius:18px;padding:20mm 15mm;text-align:center;page-break-after:always;break-after:page;box-sizing:border-box}' +
      '.qr-card:last-child{page-break-after:auto;break-after:auto}' +

      '.qr-code img,.qr-code canvas{display:block!important;width:113mm!important;height:113mm!important;max-width:none!important;image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges;image-rendering:pixelated}' +
      'h2{margin:0 0 4mm;color:#00577d;font-size:34px;font-weight:700}' +
      'p{margin:0;color:#647783;font-size:20px;font-weight:600}' +
      '.scan-label{width:100%;margin-top:14mm;padding:6mm;background:#ffd100;color:#302900;font-size:22px;font-weight:800;letter-spacing:0.5px;border-radius:10px;text-transform:uppercase}' +
      '</style></head><body><main class="qr-grid">' + printableCards + '</main>' +

      '<div class="export-summary export-summary-monthly"><strong>Isi rekap</strong><ul><li>Satu baris untuk setiap ruangan aktif</li><li>Satu kolom untuk setiap hari pada sheet rekap lengkap</li><li>Sheet <strong>CETAK A4</strong> dibagi menjadi dua lembar agar tulisan tetap terbaca</li><li>● hijau = semua sesi, ● ungu = Pagi/Sore lengkap tetapi inspeksi belum lengkap, ● oranye = sesi Pagi/Sore belum lengkap, ● merah = belum ada sesi</li></ul></div>' +
      '<div class="export-filter-actions"><button id="monthly-preview-button" class="btn btn-outline" type="button" onclick="loadMonthlyExportPreview_()">Terapkan bulan &amp; tampilkan preview</button><span id="monthly-preview-status">Preview rekap mengikuti bulan di atas.</span></div>' +
      '<button id="monthly-export-button" class="btn btn-primary export-action" disabled onclick="downloadMonthlyWorkbook()">Buat &amp; unduh rekap bulanan</button></div></section>' +

      '<div class="field-hint">Tampilan ini memperlihatkan hasil yang akan ditempatkan pada laporan utama dan sheet EVIDENCE.</div></div>' +

    var roomInput = document.getElementById('export-room');
    var dateInput = document.getElementById('export-week');
    roomInput.addEventListener('change', markExportPreviewStale_);
    dateInput.addEventListener('change', markExportPreviewStale_);
    document.getElementById('export-month').addEventListener('change', markMonthlyExportPreviewStale_);
    loadExportPreview_();
  }

  function switchExportMode_(mode) {
    state.exportMode = mode === 'monthly' ? 'monthly' : 'room';
    var roomForm = document.getElementById('export-room-form');
    var monthlyForm = document.getElementById('export-monthly-form');
    var roomButton = document.getElementById('export-mode-room');
    var monthlyButton = document.getElementById('export-mode-monthly');
    if (!roomForm || !monthlyForm) return;
    roomForm.classList.toggle('hidden', state.exportMode !== 'room');
    monthlyForm.classList.toggle('hidden', state.exportMode !== 'monthly');
    if (roomButton) { roomButton.classList.toggle('is-active', state.exportMode === 'room'); roomButton.setAttribute('aria-selected', state.exportMode === 'room' ? 'true' : 'false'); }
    if (monthlyButton) { monthlyButton.classList.toggle('is-active', state.exportMode === 'monthly'); monthlyButton.setAttribute('aria-selected', state.exportMode === 'monthly' ? 'true' : 'false'); }
    var root = document.getElementById('export-preview-root');
    var count = document.getElementById('export-preview-count');
    if (root) root.innerHTML = loadingSkeleton_('Menyiapkan preview', state.exportMode === 'monthly' ? 'Membaca status harian semua ruangan.' : 'Membaca hasil pemeriksaan sesuai filter.');
    if (count) count.textContent = 'Memuat...';
    if (state.exportMode === 'monthly') loadMonthlyExportPreview_();
    else loadExportPreview_();
  }

  function exportFilterKey_() {
    var room = document.getElementById('export-room');
    var date = document.getElementById('export-week');
    return room && date ? room.value + '|' + date.value : '';
  }

  function markExportPreviewStale_() {
    var status = document.getElementById('export-preview-status');
    var root = document.getElementById('export-preview-root');
    if (status) status.textContent = 'Filter berubah. Terapkan untuk memperbarui preview.';
    if (root && state.exportPreviewKey !== exportFilterKey_()) root.classList.add('is-stale');
  }

  function monthlyExportFilterKey_() {
    var month = document.getElementById('export-month');
    return month ? month.value : '';
  }

  function markMonthlyExportPreviewStale_() {
    var status = document.getElementById('monthly-preview-status');
    var root = document.getElementById('export-preview-root');
    if (status) status.textContent = 'Bulan berubah. Terapkan untuk memperbarui preview.';
    if (root && state.monthlyExportPreviewKey !== monthlyExportFilterKey_()) root.classList.add('is-stale');
  }

  async function loadMonthlyExportPreview_() {
    var root = document.getElementById('export-preview-root');
    var button = document.getElementById('monthly-preview-button');
    var count = document.getElementById('export-preview-count');
    var status = document.getElementById('monthly-preview-status');
    var month = document.getElementById('export-month');
    if (!root || !month || !month.value) return;
    var requestId = ++state.monthlyExportPreviewRequest;
    var key = monthlyExportFilterKey_();
    button.disabled = true;
    button.textContent = 'Memuat preview...';
    root.classList.remove('is-stale');
    root.innerHTML = loadingSkeleton_('Menyiapkan preview', 'Membaca status harian semua ruangan.');
    if (count) count.textContent = 'Memuat...';
    if (status) status.textContent = 'Mengambil rekap pemeriksaan...';
    try {
      var data = await apiCall('previewMonthlyWorkbook', { month: month.value });
      if (requestId !== state.monthlyExportPreviewRequest || !document.getElementById('export-preview-root')) return;
      if (key !== monthlyExportFilterKey_()) {
        root.innerHTML = '<div class="export-preview-loading"><strong>Bulan telah berubah</strong><small>Tekan tombol terapkan untuk menampilkan preview terbaru.</small></div>';
        if (count) count.textContent = 'Belum diterapkan';
        if (status) status.textContent = 'Bulan berubah. Terapkan untuk memperbarui preview.';
        return;
      }
      state.monthlyExportPreview = data;
      state.monthlyExportPreviewKey = key;
      renderMonthlyExportPreview_(data);
      if (status) status.textContent = 'Preview rekap sudah sesuai dengan bulan aktif.';
    } catch (error) {
      if (requestId !== state.monthlyExportPreviewRequest || !document.getElementById('export-preview-root')) return;
      root.innerHTML = '<div class="export-preview-error"><strong>Preview rekap tidak dapat ditampilkan</strong><span>' +
        esc(error.message || 'Terjadi kesalahan saat membaca data.') + '</span><button class="btn btn-outline btn-sm" type="button" onclick="loadMonthlyExportPreview_()">Coba lagi</button></div>';
      if (count) count.textContent = 'Gagal dimuat';
      if (status) status.textContent = 'Periksa konfigurasi atau coba lagi.';
    } finally {
      if (requestId === state.monthlyExportPreviewRequest && button) {
        button.disabled = false;
        button.textContent = 'Terapkan bulan & tampilkan preview';
      }
    }
  }

  function renderMonthlyExportPreview_(data) {
    var root = document.getElementById('export-preview-root');
    var count = document.getElementById('export-preview-count');
    var exportButton = document.getElementById('monthly-export-button');
    if (!root) return;
    var days = data.days || [];
    var rooms = data.rooms || [];
    var header = days.map(function(day) {
      return '<th class="monthly-day"><span>' + Number(day.number) + '</span><small>' + esc(formatDateKey(day.dateKey)) + '</small></th>';
    }).join('');
    var body = rooms.map(function(room, index) {
      var cells = (room.statuses || []).map(function(status) {
        return '<td class="monthly-status monthly-status-' + String(status.code || 'NA').toLowerCase() + '" title="' +
          esc((status.completed || 0) + ' dari ' + (status.expected || 0) + ' sesi') + '"><span>' + esc(status.symbol || '—') + '</span></td>';
      }).join('');
      var hidden = room.hidden ? '<small class="monthly-hidden-label">disembunyikan dari tampilan rutin</small>' : '';
      return '<tr><td class="monthly-room-no">' + (index + 1) + '</td><td class="monthly-room-name">' + esc(room.name) + hidden + '</td>' + cells + '</tr>';
    }).join('');
    var noData = Number(data.inspectionsCount || 0) ? '' : '<div class="export-preview-notice"><strong>Belum ada pemeriksaan pada bulan ini.</strong><span>Rekap tetap dapat diunduh; Senin–Jumat tanpa sesi akan ditandai merah, sedangkan weekend tanpa data ditandai sebagai hari nonjadwal.</span></div>';
    var legend = (data.statusLegend || []).map(function(item) {
      return '<span class="monthly-legend-item monthly-legend-' + String(item.code || '').toLowerCase() + '"><b>' + esc(item.symbol) + '</b>' + esc(item.label) + '</span>';
    }).join('');
    var hiddenNote = Number(data.hiddenRoomCount || 0) ? ' · ' + Number(data.hiddenRoomCount || 0) + ' ruangan hidden dikecualikan' : '';
    root.innerHTML = '<div class="monthly-preview"><div class="monthly-preview-head"><div><strong>Rekap monitoring ' + esc(data.monthLabel || data.month) + '</strong><span>' +
      Number(rooms.length) + ' ruangan aktif · ' + Number(days.length) + ' hari kalender · ' + Number(data.inspectionsCount || 0) + ' pemeriksaan tersimpan' + hiddenNote + '</span></div><div class="monthly-legend">' + legend + '</div></div>' + noData +
      '<div class="monthly-preview-viewport" tabindex="0" aria-label="Preview rekap monitoring bulanan yang dapat digeser horizontal"><table class="monthly-preview-table"><thead><tr><th class="monthly-room-no">NO</th><th class="monthly-room-name">RUANGAN</th>' + header + '</tr></thead><tbody>' + body + '</tbody></table></div></div>';
    if (count) count.textContent = Number(rooms.length) + ' ruangan · ' + Number(days.length) + ' hari';
    if (exportButton) exportButton.disabled = !rooms.length;
  }

  async function loadExportPreview_() {
    var root = document.getElementById('export-preview-root');
    var button = document.getElementById('export-preview-button');
    var count = document.getElementById('export-preview-count');
    var status = document.getElementById('export-preview-status');
    var room = document.getElementById('export-room');
    var date = document.getElementById('export-week');
    if (!root || !room || !date || !date.value) return;
    var requestId = ++state.exportPreviewRequest;
    var key = exportFilterKey_();
    state.exportPreview = null;
    state.exportPreviewKey = '';
    button.disabled = true;
    button.textContent = 'Memuat preview...';
    root.classList.remove('is-stale');
    root.innerHTML = loadingSkeleton_('Menyiapkan preview', 'Membaca hasil pemeriksaan sesuai filter.');
    if (count) count.textContent = 'Memuat...';
    if (status) status.textContent = 'Mengambil data pemeriksaan...';
    try {
      var data = await apiCall('previewWorkbook', { roomId: room.value, weekStart: date.value });
      if (requestId !== state.exportPreviewRequest || !document.getElementById('export-preview-root')) return;
      if (key !== exportFilterKey_()) {
        root.innerHTML = '<div class="export-preview-loading"><strong>Filter telah berubah</strong>' +
          '<small>Tekan tombol terapkan untuk menampilkan preview terbaru.</small></div>';
        if (count) count.textContent = 'Belum diterapkan';
        if (status) status.textContent = 'Filter berubah. Terapkan untuk memperbarui preview.';
        return;
      }
      state.exportPreview = data;
      state.exportPreviewKey = key;
      renderExportPreview_(data);
      if (status) status.textContent = 'Preview sudah sesuai dengan filter aktif.';
    } catch (error) {
      if (requestId !== state.exportPreviewRequest || !document.getElementById('export-preview-root')) return;
      root.innerHTML = '<div class="export-preview-error"><strong>Preview tidak dapat ditampilkan</strong><span>' +
        esc(error.message || 'Terjadi kesalahan saat membaca data.') + '</span>' +
        '<button class="btn btn-outline btn-sm" type="button" onclick="loadExportPreview_()">Coba lagi</button></div>';
      if (count) count.textContent = 'Gagal dimuat';
      if (status) status.textContent = 'Periksa konfigurasi atau coba lagi.';
    } finally {
      if (requestId === state.exportPreviewRequest && button) {
        button.disabled = false;
        button.textContent = 'Terapkan filter & tampilkan preview';
      }
    }
  }

  function renderExportPreview_(data) {
    var root = document.getElementById('export-preview-root');
    var count = document.getElementById('export-preview-count');
    var exportButton = document.getElementById('export-button');
    if (!root) return;
    var officers = data.officers || {};
    var first = officers.first || { shifts: {} };
    var second = officers.second || { shifts: {} };
    var slots = data.slots || [];
    var days = data.days || [];
    var rows = data.rows || [];
    var slotColumns = Math.max(1, slots.length * 4);
    var headerDays = days.map(function(day) {
      return '<th class="excel-day" colspan="' + slotColumns + '">Hari ke-' + Number(day.number) +
        '<small>' + esc(formatDateKey(day.dateKey)) + '</small></th>';
    }).join('');
    var headerSlots = days.map(function() {
      return slots.map(function(slot) {
        return '<th class="excel-slot excel-slot-' + attr(String(slot.code || '').toLowerCase().replace(/[^a-z0-9]+/g, '-')) +
          '" colspan="4">' + esc(slot.name) + '</th>';
      }).join('');
    }).join('');
    var headerGroups = days.map(function() {
      return slots.map(function() {
        return '<th class="excel-group excel-quality" colspan="2">Aktv</th><th class="excel-group excel-function" colspan="2">Fung</th>';
      }).join('');
    }).join('');
    var headerLabels = days.map(function() {
      return slots.map(function() {
        return '<th class="excel-result excel-quality">Pos</th><th class="excel-result excel-quality negative">Neg</th>' +
          '<th class="excel-result excel-function">Pos</th><th class="excel-result excel-function negative">Neg</th>';
      }).join('');
    }).join('');
    var body = rows.map(function(row, index) {
      var cells = days.map(function(day) {
        return slots.map(function(slot) {
          var result = (row.cells || {})[day.number + ':' + slot.order] || {};
          return previewResultCells_(result, row);
        }).join('');
      }).join('');
      return '<tr><td class="excel-sticky-no">' + (index + 1) + '</td><td class="excel-sticky-name">' +
        esc(row.name) + '</td>' + cells + '</tr>';
    }).join('');
    var noData = data.canExport ? '' : '<div class="export-preview-notice"><strong>Belum ada data pada periode ini.</strong>' +
      '<span>Struktur workbook tetap ditampilkan. Pilih tanggal Hari ke-1 yang mencakup pemeriksaan agar checklist terisi.</span></div>';
    var mainSheet = '<div class="excel-sheet"><div class="excel-sheet-title">' +
      '<strong>CEKLIS KEBERSIHAN RUANGAN &amp; KESIAPAN RUANGAN</strong>' +
      '<dl><div><dt>LOKASI</dt><dd>: ' + esc(data.room.name) + '</dd></div>' +
      '<div><dt>PERIODE</dt><dd>: ' + esc(data.period.start) + ' s.d. ' + esc(data.period.end) + '</dd></div>' +
      '<div><dt>Cleaning Service</dt><dd>: ' + esc(first.name || '') + previewShiftMarks_(first.shifts) + '</dd></div>' +
      '<div><dt>Cleaning Service</dt><dd>: ' + esc(second.name || '') + previewShiftMarks_(second.shifts) + '</dd></div>' +
      '<div><dt>Supervisor</dt><dd>: ' + esc(officers.supervisor || '') + '</dd></div></dl></div>' + noData +
      '<div class="excel-preview-viewport" tabindex="0" aria-label="Preview laporan Excel yang dapat digeser horizontal">' +
      '<table class="excel-preview-table"><thead><tr><th class="excel-sticky-no" rowspan="4">NO</th>' +
      '<th class="excel-sticky-name" rowspan="4">BAGIAN YANG<br>DIPERIKSA</th>' + headerDays + '</tr><tr>' + headerSlots +
      '</tr><tr>' + headerGroups + '</tr><tr>' + headerLabels + '</tr></thead><tbody>' + body + '</tbody></table></div></div>';
    var evidenceRows = (data.evidence || []).map(function(item) {
      return '<tr><td>' + esc(formatDateKey(item.dateKey)) + '</td><td>' + esc(item.slot) + '</td><td>' +
        esc(item.officer) + '</td><td>' + esc(item.status || '-') + '</td><td>' +
        (item.hasPhoto ? '<span class="preview-photo-ready">✓ ' + Number(item.photoCount || 1) + ' foto</span>' : '<span class="preview-photo-missing">Tidak ada</span>') + '</td></tr>';
    }).join('');
    var evidenceSheet = '<div class="evidence-preview"><div class="evidence-preview-head"><div><strong>Sheet EVIDENCE</strong>' +
      '<span>Foto asli akan dimasukkan ke file Excel saat proses unduh.</span></div><b>' + Number((data.evidence || []).length) + ' pemeriksaan</b></div>' +
      (evidenceRows ? '<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Slot</th><th>Petugas</th><th>Hasil</th><th>Evidence</th></tr></thead>' +
        '<tbody>' + evidenceRows + '</tbody></table></div>' : '<div class="empty">Belum ada baris evidence pada periode ini.</div>') + '</div>';
    root.innerHTML = mainSheet + evidenceSheet;
    if (count) count.textContent = Number(data.inspectionsCount || 0) + ' pemeriksaan · ' + Number(data.detailsCount || 0) + ' hasil';
    if (exportButton) exportButton.disabled = !data.canExport;
  }

  function previewResultCells_(result, row) {
    function cell(active, selected, tone) {
      return '<td class="excel-preview-cell ' + tone + (active ? '' : ' not-applicable') + '">' +
        (selected ? '<span title="Terpilih">✓</span>' : active ? '' : '–') + '</td>';
    }
    return cell(row.qualityApplicable, result.quality === 'POSITIVE', 'excel-quality') +
      cell(row.qualityApplicable, result.quality === 'NEGATIVE', 'excel-quality negative') +
      cell(row.functionApplicable, result.functionResult === 'POSITIVE', 'excel-function') +
      cell(row.functionApplicable, result.functionResult === 'NEGATIVE', 'excel-function negative');
  }

  function previewShiftMarks_(shifts) {
    shifts = shifts || {};
    return '<span class="preview-shifts"><span>[' + (shifts.PAGI ? '✓' : '&nbsp;&nbsp;') + '] Pagi</span>' +
      '<span>[' + (shifts.SORE ? '✓' : '&nbsp;&nbsp;') + '] Sore</span></span>';
  }

  async function downloadWorkbook() {
    var button = document.getElementById('export-button');
    if (state.exportPreviewKey !== exportFilterKey_()) await loadExportPreview_();
    if (!state.exportPreview || !state.exportPreview.canExport) {
      toast('Belum ada data pemeriksaan yang dapat diekspor untuk filter ini.', 'error');
      return;
    }
    var timer = startExportProgress_();
    button.disabled = true; button.textContent = 'Sedang membuat laporan...';
    try {
      var result = await apiCall('exportWorkbook', {
        roomId: document.getElementById('export-room').value,
        weekStart: document.getElementById('export-week').value
      });
      window.clearInterval(timer);
      setExportProgress_(100, 'Laporan siap diunduh');
      downloadDataUrl(result.dataUrl, result.name);
      toast('Laporan berhasil: ' + Number(result.inspectionsExported || 0) + ' pemeriksaan dan ' +
        Number(result.marksWritten || 0) + ' tanda checklist; ' +
        Number(result.shiftMarksWritten || 0) + ' kotak jadwal petugas terisi.', 'success');
    } catch (error) {
      window.clearInterval(timer);
      setExportProgress_(100, 'Ekspor gagal. Periksa pesan kesalahan.', true);
      handleApiError(error);
    }
    finally { button.disabled = false; button.textContent = 'Buat & unduh Excel'; }
  }

  async function downloadMonthlyWorkbook() {
    var button = document.getElementById('monthly-export-button');
    var month = document.getElementById('export-month');
    if (!button || !month || !month.value) return;
    if (state.monthlyExportPreviewKey !== monthlyExportFilterKey_()) await loadMonthlyExportPreview_();
    if (!state.monthlyExportPreview || !state.monthlyExportPreview.rooms || !state.monthlyExportPreview.rooms.length) {
      toast('Belum ada ruangan aktif yang dapat dimasukkan ke rekap.', 'error');
      return;
    }
    button.disabled = true;
    button.textContent = 'Sedang membuat rekap...';
    try {
      var result = await apiCall('exportMonthlyWorkbook', { month: month.value });
      downloadDataUrl(result.dataUrl, result.name);
      toast('Rekap bulanan berhasil: ' + Number(result.roomsExported || 0) + ' ruangan dan ' +
        Number(result.inspectionsExported || 0) + ' pemeriksaan. Gunakan sheet CETAK A4 untuk print.', 'success');
    } catch (error) {
      handleApiError(error);
    } finally {
      button.disabled = false;
      button.textContent = 'Buat & unduh rekap bulanan';
    }
  }

  function startExportProgress_() {
    var progress = document.getElementById('export-progress');
    if (progress) progress.classList.remove('hidden');
    var percent = 6;
    setExportProgress_(percent, 'Menyalin template workbook');
    return window.setInterval(function() {
      percent = Math.min(90, percent + (percent < 45 ? 7 : percent < 75 ? 4 : 2));
      var label = percent < 35 ? 'Menyalin template workbook' :
        percent < 65 ? 'Memetakan hasil checklist' :
        percent < 82 ? 'Menambahkan foto evidence' : 'Menyusun file Excel';
      setExportProgress_(percent, label);
    }, 650);
  }

  function setExportProgress_(percent, label, failed) {
    var bar = document.getElementById('export-progress-bar');
    var value = document.getElementById('export-progress-value');
    var copy = document.getElementById('export-progress-label');
    var track = bar && bar.parentElement;
    if (!bar || !value || !copy || !track) return;
    bar.style.width = Math.max(0, Math.min(100, percent)) + '%';
    bar.classList.toggle('failed', Boolean(failed));
    value.textContent = Math.round(percent) + '%';
    copy.textContent = label;
    track.setAttribute('aria-valuenow', String(Math.round(percent)));
  }

  async function renderManagement() {
    var root = document.getElementById('admin-content');
    if (state.adminData) return renderManagementShell_();
    root.innerHTML = '<section class="panel">' + loadingSkeleton_('Memuat data pengelolaan', 'Menyiapkan ruangan, indikator, dan pengguna.') + '</section>';
    try {
      await loadAdminData_();

  function filterUsersTable_() {
    var searchInput = document.getElementById('user-search-input');
    var roleSelect = document.getElementById('user-role-filter');
    var statusSelect = document.getElementById('user-status-filter');
    if (!searchInput || !roleSelect || !statusSelect) return;
    state.userSearch = searchInput.value.trim().toLowerCase();
    state.userRoleFilter = roleSelect.value;
    state.userStatusFilter = statusSelect.value;

    var rows = document.querySelectorAll('#users-table-body .user-row');
    var visible = 0;
    rows.forEach(function(row) {
      var name = row.getAttribute('data-user-name') || '';
      var username = row.getAttribute('data-username') || '';
      var role = row.getAttribute('data-role') || '';
      var active = row.getAttribute('data-active') || '0';

      var matchSearch = !state.userSearch || name.indexOf(state.userSearch) !== -1 || username.indexOf(state.userSearch) !== -1;
      var matchRole = state.userRoleFilter === 'ALL' || role === state.userRoleFilter;
      var matchStatus = state.userStatusFilter === 'ALL' || (state.userStatusFilter === 'ACTIVE' && active === '1') || (state.userStatusFilter === 'INACTIVE' && active === '0');

      var show = matchSearch && matchRole && matchStatus;
      row.style.display = show ? '' : 'none';
      if (show) visible++;
    });

    var countEl = document.getElementById('user-visible-count');
    if (countEl) countEl.textContent = visible;
    var emptyEl = document.getElementById('users-empty-message');
    if (emptyEl) emptyEl.style.display = (visible === 0 && rows.length > 0) ? 'block' : 'none';
  }

  function cameraErrorMessage_(error) {
    var name = error && error.name ? error.name : '';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return 'Browser ini tidak menyediakan mode video kamera untuk halaman aplikasi.';
    }
    if (name === 'NotAllowedError' || name === 'SecurityError') {
      return 'Mode video kamera dibatasi oleh browser atau bingkai keamanan Google Apps Script, meskipun izin situs sudah diberikan.';
    }
    if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
      return 'Kamera tidak ditemukan pada perangkat.';
    }
    if (name === 'NotReadableError' || name === 'TrackStartError') {
      return 'Kamera sedang digunakan aplikasi lain. Tutup aplikasi kamera lain lalu coba kembali.';
    }
    return 'Mode video kamera tidak dapat dimulai' + (name ? ' (' + name + ')' : '') + '.';
  }
  function loadImageFile_(file) {
    return new Promise(function(resolve, reject) {
      var reader = new FileReader();
      reader.onerror = reject;
      reader.onload = function() {
        var image = new Image();
        image.onerror = reject;
        image.onload = function() { resolve(image); };
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  async function resizeImageFile_(file, maxWidth, quality) {
    var image = await loadImageFile_(file);
    var scale = Math.min(1, maxWidth / image.width);
    var canvas = document.createElement('canvas');
    canvas.width = Math.round(image.width * scale);
    canvas.height = Math.round(image.height * scale);
    canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', quality);
  }
  function showModal(title, body, footer, extraClass) {
    document.getElementById('modal-root').innerHTML =
      '<div class="modal-backdrop"><section class="modal ' + (extraClass || '') + '" role="dialog" aria-modal="true">' +
      '<header class="modal-head"><h2>' + esc(title) + '</h2><button class="modal-close" onclick="closeModal()">&times;</button></header>' +
      '<div class="modal-body">' + body + '</div><footer class="modal-foot">' + (footer || '') + '</footer></section></div>';
  }
  function closeModal() { stopCamera(); document.getElementById('modal-root').innerHTML = ''; }
  function toast(message, tone) {
    var item = document.createElement('div'); item.className = 'toast ' + (tone || ''); item.textContent = message;
    document.getElementById('toast-region').appendChild(item);
    window.setTimeout(function() { item.remove(); }, 4200);
  }
  function handleApiError(error) {
    if (isSessionError(error)) { clearSession(); closeModal(); return renderLogin(error.message); }
    toast(error.message || 'Terjadi kesalahan.', 'error');
  }
  function isSessionError(error) {
    return ['SESSION_REQUIRED','SESSION_INVALID','SESSION_EXPIRED','USER_INACTIVE'].indexOf(error.code) !== -1;
  }
  function roleLabel(role) {
    return role === 'ADMIN' ? 'Administrator' : role === 'SUPERVISOR' ? 'Supervisor' : 'Petugas';
  }
  function statusBadge(status) {
    return status === 'BERSIH' ? '<span class="badge badge-clean">' + statusSymbol_('done') + 'Bersih</span>' :
      '<span class="badge badge-dirty">' + statusSymbol_('finding') + 'Ada temuan</span>';
  }
  function formatDateKey(dateKey) {
    var parts = String(dateKey || '').split('-');
    if (parts.length !== 3) return dateKey;
    var months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    return Number(parts[2]) + ' ' + months[Number(parts[1]) - 1] + ' ' + parts[0];
  }
  function startOfCurrentPeriod_() {
    var date = new Date();
    var offset = date.getTimezoneOffset() * 60000;
    return new Date(date.getTime() - offset).toISOString().slice(0, 10);
  }
  function downloadDataUrl(dataUrl, fileName) {
    var link = document.createElement('a'); link.href = dataUrl; link.download = fileName;
    document.body.appendChild(link); link.click(); link.remove();
  }
  function appRoot() { return document.getElementById('app'); }
  function esc(value) {
    return String(value === undefined || value === null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }
  function attr(value) { return esc(value); }
  function jsq(value) { return String(value || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\r?\n/g, ' '); }
  function cssEscape(value) { return window.CSS && CSS.escape ? CSS.escape(value) : String(value).replace(/[^a-zA-Z0-9_-]/g, '\\$&'); }
</script>
