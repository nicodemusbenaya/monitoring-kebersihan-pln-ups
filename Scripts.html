<script>
  var state = {
    context: window.INITIAL_CONTEXT,
    sessionToken: localStorage.getItem('pln_ups_session') || '',
    bootstrap: null,
    scanned: null,
    selectedSlot: null,
    evidenceData: '',
    evidenceDataList: [],
    cameraStream: null,
    roomTokenConsumed: false,
    adminTab: 'dashboard',
    adminData: null,
    adminDataPromise: null,
    qrData: null,
    qrDataPromise: null,
    qrImages: {},
    managementSection: 'rooms',
    managementSearch: '',
    managementRoomType: '',
    exportPreview: null,
    exportPreviewKey: '',
    exportPreviewRequest: 0,
    exportMode: 'room',
    monthlyExportPreview: null,
    monthlyExportPreviewKey: '',
    monthlyExportPreviewRequest: 0,
    evaluation: null,
    evaluationReport: null,
    evaluationReportRequest: 0,
    officerPerformance: null,
    officerPerformanceRequest: 0,
    satisfactionSubTab: 'evaluation',
    sidebarCollapsed: localStorage.getItem('pln_ups_sidebar_collapsed') === '1',
    presentationMode: localStorage.getItem('pln_ups_presentation_mode') === '1',
    presentationTab: 'dashboard',
    presentationTimer: null,
    presentationRefreshInFlight: false,
    dashboardRoomFilter: 'ALL',
    dashboardRoomSearch: '',
    dashboardAttentionFilter: 'ALL',
    dashboardAttentionExpanded: false,
    userSearch: '',
    userRoleFilter: 'ALL',
    userStatusFilter: 'ALL'
  };

  document.addEventListener('DOMContentLoaded', startApp);

  function apiCall(action, payload) {
    payload = payload || {};
    if (state.sessionToken && !payload.sessionToken) payload.sessionToken = state.sessionToken;
    return new Promise(function(resolve, reject) {
      google.script.run.withSuccessHandler(function(response) {
        if (response && response.ok) return resolve(response.data);
        var error = new Error(response && response.error ? response.error.message : 'Respons server tidak valid.');
        error.code = response && response.error ? response.error.code : 'SERVER_ERROR';
        reject(error);
      }).withFailureHandler(function(error) {
        reject(new Error(error && error.message ? error.message : 'Tidak dapat menghubungi server.'));
      }).api(action, payload);
    });
  }

  async function startApp() {
    if (state.context.evaluationToken) return loadEvaluationContext_();
    if (!state.sessionToken) return renderLogin();
    await loadBootstrap();
  }

  async function loadEvaluationContext_() {
    renderEvaluationLoading_();
    try {
      state.evaluation = await apiCall('getEvaluationContext', { roomToken: state.context.evaluationToken });
      renderEvaluation_();
    } catch (error) {
      appRoot().innerHTML = '<main class="evaluation-shell"><section class="evaluation-card evaluation-error"><div class="eyebrow">Tautan evaluasi</div>' +
        '<h1>Tautan tidak dapat dibuka</h1><p>' + esc(error.message || 'Tautan evaluasi tidak valid.') + '</p></section></main>';
    }
  }

  function renderEvaluationLoading_() {
    appRoot().innerHTML = '<main class="evaluation-shell"><section class="evaluation-card evaluation-loading">' +
      '<div class="evaluation-mark">★</div><div class="eyebrow">Evaluasi anonim</div><h1>Menyiapkan formulir</h1>' +
      '<p>Memuat aspek penilaian untuk ruangan ini.</p><div class="scan-loading-skeleton"><span></span><span></span><span></span></div></section></main>';
  }

  async function loadBootstrap() {
    if (state.context.roomToken && !state.roomTokenConsumed) renderScanLoading();
    else renderLoading();
    try {
      var bootstrapPayload = {};
      if (state.context.roomToken && !state.roomTokenConsumed) {
        bootstrapPayload.roomToken = state.context.roomToken;
        bootstrapPayload.userAgent = navigator.userAgent;
      }
      state.bootstrap = await apiCall('bootstrap', bootstrapPayload);
      if (state.bootstrap.user.mustChangePassword) {
        renderHome();
        showPasswordModal(true);
        return;
      }
      if (state.bootstrap.mode !== 'ADMIN' && state.context.roomToken && !state.roomTokenConsumed) {
        state.roomTokenConsumed = true;
        if (state.bootstrap.openedRoom) {
          state.scanned = state.bootstrap.openedRoom;
          renderSlotSelection();
          return;
        }
        await openScannedRoom('PLNUPS:ROOM:' + state.context.roomToken);
        return;
      }
      renderHome();
    } catch (error) {
      if (isSessionError(error)) clearSession();
      renderLogin(error.message);
    }
  }

  function renderLoading() {
    appRoot().innerHTML = '<div class="initial-loader"><div class="brand-mark"><img src="' +
      attr(state.context.logoUrl) + '" alt="Logo PLN"></div><div class="skeleton-line wide"></div><div class="skeleton-line"></div></div>';
  }

  function statusSymbol_(variant, className) {
    var paths = {
      done: '<circle cx="16" cy="16" r="11"></circle><path d="m10.5 16.2 3.7 3.8 7.8-8.2"></path>',
      finding: '<path d="m16 4 8.5 3.5L28 16l-3.5 8.5L16 28l-8.5-3.5L4 16l3.5-8.5L16 4Z"></path><path d="M16 10.5v7.2M16 22h.01"></path>',
      pending: '<circle cx="16" cy="16" r="11"></circle><path d="M16 9.5V16l4.5 2.8"></path><path d="M7.5 7.5 5 5"></path>',
      neutral: '<circle cx="16" cy="16" r="11"></circle><path d="M11 16h10"></path>'
    };
    return '<span class="status-symbol ' + attr(className || '') + '" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">' +
      (paths[variant] || paths.neutral) + '</svg></span>';
  }

  function renderEvaluation_() {
    var data = state.evaluation;
    var labels = data.ratingLabels || {};
    var ratingChoices = [1, 2, 3, 4].map(function(rating) {
      return '<label class="evaluation-rating-option rating-' + rating + '"><input type="radio" name="evaluation-rating" value="' + rating +
        '" onchange="updateEvaluationFields_()"><span class="evaluation-stars" aria-hidden="true">' + '★'.repeat(rating) + '</span>' +
        '<strong>' + esc(labels[rating] || '') + '</strong><small>' + rating + ' dari 4</small></label>';
    }).join('');
    var aspects = (data.aspects || []).map(function(aspect) {
      return '<label class="evaluation-aspect"><input type="checkbox" name="evaluation-aspect" value="' + attr(aspect.code) + '"><span>' + esc(aspect.label) + '</span></label>';
    }).join('');
    appRoot().innerHTML = '<main class="evaluation-shell"><section class="evaluation-card"><div class="evaluation-card-top">' +
      '<img src="' + attr(data.app.logoUrl) + '" alt="Logo PLN"><span>Evaluasi anonim</span></div>' +
      '<div class="eyebrow">Tanggapan pengguna</div><h1>Bagaimana kondisi ' + esc(data.room.name) + '?</h1>' +
      '<p class="evaluation-intro">Penilaian ini tidak meminta nama. Pilih satu rating untuk membantu kami menjaga kualitas kebersihan.</p>' +
      '<form onsubmit="submitEvaluationForm_(event)"><fieldset class="evaluation-rating-group"><legend>Berikan penilaian <span class="required">*</span></legend>' +
      '<div class="evaluation-rating-grid">' + ratingChoices + '</div></fieldset>' +
      '<section id="evaluation-followup" class="evaluation-followup hidden"><div class="evaluation-followup-head"><strong>Apa yang perlu ditingkatkan?</strong><span>Pilih semua yang sesuai.</span></div>' +
      '<div class="evaluation-aspect-grid">' + (aspects || '<span class="field-hint">Belum ada aspek yang dikonfigurasi.</span>') + '</div>' +
      '<div class="field evaluation-comment-field"><label id="evaluation-comment-label">Jelaskan alasan penilaian <span class="required">*</span></label>' +
      '<textarea id="evaluation-comment" rows="4" placeholder="Tuliskan hal yang perlu kami perhatikan"></textarea><div id="evaluation-comment-hint" class="field-hint">Penjelasan membantu tim menentukan tindak lanjut.</div></div></section>' +
      '<div class="evaluation-actions"><span>Data disimpan tanpa nama pengisi.</span><button id="evaluation-submit" class="btn btn-primary">Kirim evaluasi</button></div></form></section></main>';
  }

  function updateEvaluationFields_() {
    var selected = document.querySelector('input[name="evaluation-rating"]:checked');
    var followup = document.getElementById('evaluation-followup');
    var label = document.getElementById('evaluation-comment-label');
    var hint = document.getElementById('evaluation-comment-hint');
    if (!selected || !followup) return;
    var low = Number(selected.value) <= 2;
    var medium = Number(selected.value) === 3;
    followup.classList.toggle('hidden', !low && !medium);
    if (label) label.innerHTML = low ? 'Jelaskan alasan penilaian <span class="required">*</span>' : 'Komentar tambahan <span class="field-hint">(opsional)</span>';
    if (hint) hint.textContent = low ? 'Penjelasan membantu tim menentukan tindak lanjut.' : 'Ceritakan hal yang sudah baik atau saran singkat jika berkenan.';
  }

  async function submitEvaluationForm_(event) {
    event.preventDefault();
    var ratingInput = document.querySelector('input[name="evaluation-rating"]:checked');
    if (!ratingInput) return toast('Pilih rating terlebih dahulu.', 'error');
    var rating = Number(ratingInput.value);
    var aspectCodes = Array.prototype.slice.call(document.querySelectorAll('input[name="evaluation-aspect"]:checked')).map(function(input) { return input.value; });
    var comment = (document.getElementById('evaluation-comment') || {}).value || '';
    if (rating <= 2 && (!aspectCodes.length || !comment.trim())) {
      return toast('Pilih aspek yang perlu ditingkatkan dan tuliskan alasannya.', 'error');
    }
    var button = document.getElementById('evaluation-submit');
    button.disabled = true; button.textContent = 'Menyimpan...';
    try {
      var result = await apiCall('submitEvaluation', {
        roomToken: state.context.evaluationToken, rating: rating, aspectCodes: aspectCodes,
        comment: comment, userAgent: navigator.userAgent
      });
      appRoot().innerHTML = '<main class="evaluation-shell"><section class="evaluation-card evaluation-success"><div class="evaluation-success-mark">✓</div>' +
        '<div class="eyebrow">Terima kasih</div><h1>Evaluasi sudah diterima</h1><p>Masukan Anda membantu kami meningkatkan kondisi ' + esc(result.roomName) + '.</p>' +
        '<div class="evaluation-receipt"><span>Penilaian Anda</span><strong>' + '★'.repeat(Number(result.rating)) + '</strong><small>' + esc(result.ratingLabel) + ' · ' + esc(result.displayTime) + ' WIB</small></div>' +
        '<p class="field-hint">Tidak ada nama atau akun yang dicatat.</p></section></main>';
    } catch (error) {
      button.disabled = false; button.textContent = 'Kirim evaluasi'; handleApiError(error);
    }
  }

  function renderScanLoading() {
    var logoUrl = state.bootstrap && state.bootstrap.app ? state.bootstrap.app.logoUrl : state.context.logoUrl;
    var header = state.bootstrap ? renderHeader('Memproses QR ruangan') : '';
    appRoot().innerHTML = header +
      '<main class="scan-loading-page" role="status" aria-live="polite" aria-busy="true">' +
      '<section class="scan-loading-card"><div class="scan-loader-visual" aria-hidden="true">' +
      '<div class="scan-loader-frame"><img src="' + attr(logoUrl) + '" alt=""><span class="scan-loader-beam"></span></div></div>' +
      '<div class="scan-loading-status">QR berhasil terbaca</div>' +
      '<h1>Menyiapkan checklist ruangan</h1>' +
      '<p>Memverifikasi ruangan, jadwal, dan indikator pemeriksaan.</p>' +
      '<div class="scan-loading-skeleton" aria-hidden="true"><span></span><span></span><span></span></div>' +
      '<small>Mohon tunggu. Jangan tutup halaman ini.</small></section></main>';
  }

  function renderLogin(message) {
    appRoot().innerHTML =
      '<main class="login-layout"><section class="login-brand">' +
      '<div class="brand-mark"><img src="' + attr(state.context.logoUrl) + '" alt="Logo PLN"></div>' +
      '<div class="login-copy"><h1>Ruang bersih, kerja lebih baik.</h1>' +
      '<p>Monitoring kebersihan PLN UPS dengan pemeriksaan terjadwal dan bukti foto.</p></div>' +
      '<div class="room-chip">Masuk sekali, lalu pindai QR ruangan dari aplikasi</div></section>' +
      '<section class="login-panel"><div class="login-card"><h2>Masuk ke aplikasi</h2>' +
      '<p>Gunakan username dan password yang diberikan administrator.</p>' +
      (message ? '<div class="form-error">' + esc(message) + '</div>' : '') +
      '<form onsubmit="handleLogin(event)"><div class="field"><label>Username</label><input id="username" autocomplete="username" required autofocus></div>' +
      '<div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div>' +
      '<button id="login-button" class="btn btn-primary btn-block">Masuk</button></form></div></section></main>';
  }

  async function handleLogin(event) {
    event.preventDefault();
    var button = document.getElementById('login-button');
    button.disabled = true;
    try {
      var result = await apiCall('login', {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      });
      state.sessionToken = result.sessionToken;
      localStorage.setItem('pln_ups_session', state.sessionToken);
      await loadBootstrap();
    } catch (error) { renderLogin(error.message); }
  }

  function renderHome() {
    if (state.bootstrap.mode === 'ADMIN') renderAdmin();
    else renderScannerHome();
  }

  function renderHeader(subtitle) {
    var user = state.bootstrap.user;
    var config = state.bootstrap.app;
    return '<header class="topbar"><div class="topbar-inner"><div class="topbar-brand">' +
      '<img src="' + attr(config.logoUrl) + '" alt="Logo PLN"><span class="brand-divider"></span>' +
      '<div class="topbar-title"><strong>' + esc(config.name) + '</strong><span>' + esc(subtitle) + '</span></div></div>' +
      '<div class="user-area"><div class="user-copy"><strong>' + esc(user.fullName) + '</strong><span>' +
      esc(roleLabel(user.role)) + '</span></div><button class="btn btn-secondary btn-sm" onclick="logout()">Keluar</button></div></div></header>';
  }

  function renderScannerHome() {
    state.scanned = null;
    state.selectedSlot = null;
    state.evidenceData = '';
    state.evidenceDataList = [];
    appRoot().innerHTML = renderHeader('Pemindaian ruangan') +
      '<main class="page"><section class="room-banner"><div><div class="eyebrow" style="color:#ffd100">CHECKLIST HARIAN</div>' +
      '<h1>Buka checklist ruangan</h1><p>Arahkan kamera langsung ke QR yang ditempel di ruangan untuk membuka checklist.</p></div>' +
      '<div class="scan-box"><button type="button" class="btn btn-primary btn-block" onclick="startQrScanner()">Baca QR Ruangan</button>' +
      '<span style="margin-top:9px">Kamera langsung dari perangkat</span></div></section>' +
      '<section class="panel"><div class="panel-body"><div class="empty">' +
      '<strong>Belum ada ruangan terbuka.</strong><br>Tekan <b>Baca QR Ruangan</b>, lalu izinkan kamera untuk memindai QR.' +
      '<div class="field-hint" style="margin-top:12px">Pemindaian QR hanya menggunakan kamera langsung.</div>' +
      '</div></div></section></main>';
  }

  function startQrScanner() {
    showModal('Pindai QR ruangan',
      '<section class="qr-native-capture"><div class="qr-native-capture-card">' +
      '<div class="qr-native-capture-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h1.2l1-1.5h2.6l1 1.5h1.2A2.5 2.5 0 0 1 16 7.5v7A2.5 2.5 0 0 1 13.5 17h-7A2.5 2.5 0 0 1 4 14.5v-7Z"/><circle cx="10" cy="11" r="2.6"/><path d="M18 9h2M18 13h2M18 17h2"/></svg></div>' +
      '<strong>Ambil foto QR ruangan</strong><p>Kamera bawaan perangkat akan terbuka. Arahkan ke QR, ambil foto, lalu aplikasi membaca QR dari foto tersebut.</p>' +
      '<label class="btn btn-primary" for="qr-camera-input">Buka kamera</label>' +
      '<input id="qr-camera-input" class="capture-input" type="file" accept="image/*" capture="environment" onchange="decodeQrPhoto(event)">' +
      '<canvas id="qr-canvas" class="hidden"></canvas><div id="qr-camera-error"></div></div></section>',
      '<button class="btn btn-secondary" onclick="closeModal()">Batal</button>', 'modal-wide');
  }

  async function decodeQrPhoto(event) {
    var file = event.target.files && event.target.files[0];
    if (!file) return;
    try {
      var nativeValue = await decodeQrNative_(file);
      if (nativeValue) {
        stopCamera(); closeModal(); openScannedRoom(nativeValue);
        return;
      }
      var image = await loadImageFile_(file);
      var canvas = document.getElementById('qr-canvas');
      var code = decodeQrImageMultiPass_(image, canvas);
      if (!code || !code.data) {
        var target = document.getElementById('qr-camera-error');
        if (target) target.innerHTML = '<div class="notice notice-warning">QR belum terbaca. Ambil foto lebih dekat, pastikan tidak buram, lalu tekan Buka kamera lagi.</div>';
        return;
      }
      stopCamera(); closeModal(); openScannedRoom(code.data);
    } catch (error) {
      var target = document.getElementById('qr-camera-error');
      if (target) target.innerHTML = '<div class="notice notice-warning">Foto QR tidak dapat diproses. Coba ambil foto ulang dengan pencahayaan yang cukup.</div>';
    } finally {
      event.target.value = '';
    }
  }

  async function decodeQrNative_(file) {
    if (!window.BarcodeDetector || !window.createImageBitmap) return '';
    try {
      var supported = await BarcodeDetector.getSupportedFormats();
      if (supported.indexOf('qr_code') === -1) return '';
      var bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
      var results = await new BarcodeDetector({ formats: ['qr_code'] }).detect(bitmap);
      if (bitmap.close) bitmap.close();
      return results.length ? String(results[0].rawValue || '') : '';
    } catch (error) {
      return '';
    }
  }

  function decodeQrImageMultiPass_(image, canvas) {
    var maxSizes = [2400, 1600, 1000];
    var rotations = [0, 90, 180, 270];
    for (var s = 0; s < maxSizes.length; s++) {
      var scale = Math.min(1, maxSizes[s] / Math.max(image.width, image.height));
      var baseWidth = Math.max(1, Math.round(image.width * scale));
      var baseHeight = Math.max(1, Math.round(image.height * scale));
      for (var r = 0; r < rotations.length; r++) {
        var angle = rotations[r];
        var swap = angle === 90 || angle === 270;
        canvas.width = swap ? baseHeight : baseWidth;
        canvas.height = swap ? baseWidth : baseHeight;
        var ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(angle * Math.PI / 180);
        ctx.drawImage(image, -baseWidth / 2, -baseHeight / 2, baseWidth, baseHeight);
        ctx.restore();
        var pixels = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var result = jsQR(pixels.data, canvas.width, canvas.height, { inversionAttempts: 'attemptBoth' });
        if (result && result.data) return result;
      }
    }
    return null;
  }

  function scanVideoFrame(video) {
    if (!state.cameraStream || !document.getElementById('qr-canvas')) return;
    if (video.readyState >= 2 && video.videoWidth) {
      var canvas = document.getElementById('qr-canvas');
      var ctx = canvas.getContext('2d', { willReadFrequently: true });
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      var code = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height, {
        inversionAttempts: 'attemptBoth'
      });
      if (code && code.data) {
        stopCamera();
        closeModal();
        return openScannedRoom(code.data);
      }
    }
    window.setTimeout(function() { scanVideoFrame(video); }, 220);
  }

  async function openScannedRoom(qrPayload) {
    state.scanned = null;
    state.selectedSlot = null;
    state.evidenceData = '';
    state.evidenceDataList = [];
    renderScanLoading();
    try {
      state.scanned = await apiCall('scanRoom', { qrPayload: qrPayload, userAgent: navigator.userAgent });
      renderSlotSelection();
    } catch (error) {
      renderScannerHome();
      handleApiError(error);
    }
  }

  function renderSlotSelection() {
    var data = state.scanned;
    var slots = data.slots.map(function(slot) {
      var done = slot.completed;
      return '<button type="button" class="slot-choice ' + (done ? 'completed' : 'available') + '" ' +
        (done ? 'disabled' : 'onclick="selectSlot(\'' + jsq(slot.slotId) + '\')"') + '>' +
        '<span class="slot-choice-copy"><strong>' + esc(slot.name) + '</strong><small>' +
        (done ? 'Diisi oleh ' + esc(done.officerName) + ' pada ' + esc(done.displayTime) : 'Belum diisi') +
        '</small></span><span class="slot-choice-end">' +
        (done ? statusBadge(done.overallStatus) : '<strong>Isi sekarang</strong><span aria-hidden="true">→</span>') +
        '</span></button>';
    }).join('');
    var prior = '';
    if (data.petugasResults && data.petugasResults.length) {
      prior = '<section class="panel"><div class="panel-head"><h2>Hasil petugas hari ini</h2></div><div class="panel-body"><div class="prior-result-list">' +
        data.petugasResults.map(function(item) {
          return '<div class="prior-result"><div><strong>' + esc(item.slotName) + '</strong><span>' +
            esc(item.officerName) + ' • ' + esc(item.displayTime) + '</span></div>' + statusBadge(item.overallStatus) + '</div>';
        }).join('') + '</div></div></section>';
    }
    appRoot().innerHTML = renderHeader(data.room.name) + '<main class="page">' +
      '<section class="room-banner"><div><div class="eyebrow" style="color:#ffd100">LOKASI TERVERIFIKASI</div><h1>' +
      esc(data.room.name) + '</h1><p>' + esc(data.roomType.name) + ' • ' + esc(formatDateKey(data.dateKey)) + '</p></div>' +
      '<div class="scan-box"><span>Waktu pemindaian</span><strong>' + esc(data.scan.displayTime) + ' WIB</strong></div></section>' +
      '<section class="panel slot-panel"><div class="panel-head"><h2>Pilih waktu pemeriksaan</h2></div><div class="panel-body"><div class="slot-choice-list">' +
      (slots || '<div class="empty">Tidak ada slot untuk peran akun ini.</div>') + '</div></div></section>' + prior +
      '<button class="btn btn-secondary" onclick="renderScannerHome()">Pindai ruangan lain</button></main>';
  }

  function selectSlot(slotId) {
    state.selectedSlot = state.scanned.slots.find(function(slot) { return slot.slotId === slotId; });
    state.evidenceData = '';
    state.evidenceDataList = [];
    renderChecklist();
  }

  function renderChecklist() {
    var data = state.scanned;
    if (!data || !state.selectedSlot) return renderScannerHome();
    if (!Array.isArray(data.activities) || !data.activities.length) {
      renderSlotSelection();
      return toast('Indikator pemeriksaan belum tersedia. Pindai ulang setelah data dimuat kembali.', 'error');
    }
    var cards = data.activities.map(function(activity, index) {
      var id = attr(activity.activityId);
      var quality = activity.qualityApplicable ? dimensionChoices_(id, 'quality', 'Aktivitas / kualitas',
        activity.qualityPositive, activity.qualityNegative) : '';
      var func = activity.functionApplicable ? dimensionChoices_(id, 'function', 'Fungsi / kondisi',
        activity.functionPositive, activity.functionNegative) : '';
      var standard = renderActivityStandard_(activity);
      return '<section class="activity-card" data-activity-id="' + id + '"><div class="activity-head">' +
        '<div class="activity-number">' + (index + 1) + '</div><div class="activity-heading-copy"><div class="activity-name">' +
        esc(activity.name) + '</div>' + standard + '</div></div>' +
        '<div class="activity-choices">' + quality + func + '</div>' +
        '<div class="field"><label>Catatan temuan</label><textarea id="note-' + id +
        '" placeholder="Wajib jika salah satu hasil negatif"></textarea></div></section>';
    }).join('');
    appRoot().innerHTML = renderHeader(data.room.name + ' • ' + state.selectedSlot.name) +
      '<main class="page"><section class="room-banner"><div><div class="eyebrow" style="color:#ffd100">' +
      esc(state.selectedSlot.name.toUpperCase()) + '</div><h1>' + esc(data.room.name) + '</h1>' +
      '<p>Isi kedua bagian yang tersedia pada setiap indikator.</p></div></section>' +

  async function captureEvidenceFile(event) {
    var file = event.target.files && event.target.files[0];
    if (!file) return;
    try {
      addEvidencePhoto_(await resizeImageFile_(file, 960, 0.68));
      stopCamera(); closeModal();
    } catch (error) {
      var target = document.getElementById('evidence-camera-error');
      if (target) target.innerHTML = '<div class="notice notice-warning">Foto evidence tidak dapat diproses. Silakan tekan <strong>Buka kamera</strong> lagi.</div>';
    } finally {
      event.target.value = '';
    }
  }

  function captureEvidence() {
    var video = document.getElementById('evidence-video');
    if (!video || !video.videoWidth) return;
    var canvas = document.getElementById('evidence-canvas');
    var width = Math.min(960, video.videoWidth);
    var height = Math.round(video.videoHeight * width / video.videoWidth);
    canvas.width = width; canvas.height = height;
    canvas.getContext('2d').drawImage(video, 0, 0, width, height);
    addEvidencePhoto_(canvas.toDataURL('image/jpeg', 0.68));
    stopCamera(); closeModal();
  }

  async function submitChecklist(event) {
    event.preventDefault();
    var answers = [];
    for (var i = 0; i < state.scanned.activities.length; i++) {
      var activity = state.scanned.activities[i];
      var q = activity.qualityApplicable ? document.querySelector('input[name="quality-' + cssEscape(activity.activityId) + '"]:checked') : null;
      var f = activity.functionApplicable ? document.querySelector('input[name="function-' + cssEscape(activity.activityId) + '"]:checked') : null;
      if ((activity.qualityApplicable && !q) || (activity.functionApplicable && !f)) {
        return toast('Semua indikator wajib diisi.', 'error');
      }
      var note = document.getElementById('note-' + activity.activityId).value.trim();
      if ((q && q.value === 'NEGATIVE') || (f && f.value === 'NEGATIVE')) {
        if (!note) return toast('Catatan wajib pada setiap indikator yang memiliki temuan.', 'error');
      }
      answers.push({
        activityId: activity.activityId,
        qualityResult: q ? q.value : 'NA',
        functionResult: f ? f.value : 'NA',
        note: note
      });
    }
    if (!state.evidenceDataList.length) return toast('Ambil minimal satu foto evidence sebelum mengirim.', 'error');
    var button = document.getElementById('submit-button');
    button.disabled = true; button.textContent = 'Menyimpan pemeriksaan...';
    try {
      var result = await apiCall('submitInspection', {
        scanId: state.scanned.scan.scanId, slotId: state.selectedSlot.slotId,
        answers: answers, evidenceDataList: state.evidenceDataList
      });
      toast('Pemeriksaan berhasil disimpan.', 'success');
      appRoot().innerHTML = renderHeader(result.roomName) +
        '<main class="page"><section class="panel"><div class="panel-body">' +
        '<div class="notice notice-success"><strong>Pemeriksaan berhasil disimpan.</strong><br>' +
        esc(result.slotName) + ' • ' + esc(result.displayTime) + ' WIB</div>' +
        '<p>Hasil: ' + statusBadge(result.overallStatus) + ' &nbsp; Temuan: <strong>' +
        Number(result.dirtyCount) + '</strong> &nbsp; Foto: <strong>' + Number(result.photoCount || 1) + '</strong></p><button class="btn btn-primary" onclick="renderScannerHome()">Pindai ruangan</button>' +
        '</div></section></main>';
    } catch (error) {
      button.disabled = false; button.textContent = 'Kirim pemeriksaan';
      handleApiError(error);
    }
  }

    if (state.presentationTimer) clearInterval(state.presentationTimer);

      refreshPresentationData_();

  async function refreshPresentationData_() {
    if (!state.presentationMode || state.presentationRefreshInFlight) return;
    state.presentationRefreshInFlight = true;
    try {
      if (state.presentationTab === 'officer') {
        var preset = state.presentationOfficerPreset || 'month';
        var periodInfo = calculatePeriodForPreset_(preset);
        var report = await apiCall('getOfficerPerformanceReport', { startDate: periodInfo.start, endDate: periodInfo.end });
        state.officerPerformance = report;
        renderOfficerPerformance_(report, 'presentation-officer-root');
      } else {
        var dashboard = state.bootstrap && state.bootstrap.dashboard ? state.bootstrap.dashboard : {};
        state.bootstrap = await apiCall('bootstrap', {
          month: dashboard.month || '', roomId: dashboard.roomId || ''
        });
        if (state.adminTab === 'dashboard') renderDashboardView_();
      }
    } catch (error) {
      console.warn('Refresh mode presentasi gagal: ' + (error.message || error));
    } finally {
      state.presentationRefreshInFlight = false;
    }
  }

  function nowIso_() {
    return (new Date()).toISOString();
  }

  function formatDateKey(dateKey) {
    if (!dateKey) return '-';
    var parts = String(dateKey).split('-');
    if (parts.length !== 3) return dateKey;
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }

  function calculatePeriodForPreset_(preset) {
    var end = new Date();
    var start = new Date();
    if (preset === 1 || preset === '1' || preset === 'today') {
      start = new Date();
      end = new Date();
      var startStr = localDateKey_(start);
      return { start: startStr, end: startStr, label: formatLongDateKey_(startStr) };
    } else if (preset === 'month') {
      var monthPeriod = currentMonthPeriod_();
      return { start: monthPeriod.start, end: monthPeriod.end, label: formatMonthKey_(monthPeriod.start.substring(0, 7)) };
    } else {
      var days = Number(preset) || 30;
      start = new Date(end.getTime() - (days - 1) * 86400000);
      var startStr = localDateKey_(start);
      var endStr = localDateKey_(end);
      return { start: startStr, end: endStr, label: formatDateKey(startStr) + ' – ' + formatDateKey(endStr) };
    }
  }

    if (!state.bootstrap || state.bootstrap.mode !== 'ADMIN') return;
    loadAdminData_().catch(function() {});
    loadQrData_().catch(function() {});
  }

  async function refreshApplicationData_() {
    var button = document.getElementById('admin-refresh-button');
    if (button) { button.disabled = true; button.classList.add('is-loading'); button.setAttribute('aria-busy', 'true'); }
    try {
      state.adminData = null;
      state.adminDataPromise = null;
      state.qrData = null;
      state.qrDataPromise = null;
      state.qrImages = {};
      state.exportPreview = null;
      state.exportPreviewKey = '';
      state.evaluationReport = null;
      state.officerPerformance = null;
      state.bootstrap = await apiCall('bootstrap', {});
      if (state.adminTab === 'management' || state.adminTab === 'users') await loadAdminData_(true);
      renderAdmin();
      toast('Data aplikasi sudah diperbarui.', 'success');
    } catch (error) {
      if (button) { button.disabled = false; button.classList.remove('is-loading'); button.removeAttribute('aria-busy'); }
      handleApiError(error);
    }
  }

  function loadAdminData_(force) {
    if (!force && state.adminData) return Promise.resolve(state.adminData);
    if (!force && state.adminDataPromise) return state.adminDataPromise;
    state.adminDataPromise = apiCall('getAdminData', {}).then(function(data) {
      state.adminData = data;
      state.adminDataPromise = null;
      return data;
    }, function(error) {
      state.adminDataPromise = null;
      throw error;
    });
    return state.adminDataPromise;
  }

  function loadQrData_(force) {
    if (!force && state.qrData) return Promise.resolve(state.qrData);
    if (!force && state.qrDataPromise) return state.qrDataPromise;
    state.qrDataPromise = apiCall('getQrData', {}).then(function(data) {
      state.qrData = data;
      state.qrDataPromise = null;
      return data;
    }, function(error) {
      state.qrDataPromise = null;
      throw error;
    });
    return state.qrDataPromise;
  }

  function renderDashboard() {
    if (state.presentationMode && state.presentationTab === 'officer') {
      return loadPresentationOfficerPerformance_();
    }
    renderDashboardView_();
  }

    }).join('');
    var roomStatusCard = '<article class="dashboard-card room-status-card"><header><div><div class="dashboard-section-kicker">Cakupan hari ini</div><h2>Status ruangan</h2><p>Diurutkan dari ruangan yang paling membutuhkan perhatian.</p></div><strong id="dashboard-room-visible-count" class="panel-count neutral">' + roomRows.length + '</strong></header>' +
      '<div class="room-status-toolbar"><div class="dashboard-segments" aria-label="Filter status ruangan">' + roomFilterButtons + '</div><label class="dashboard-room-search"><span class="sr-only">Cari ruangan</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg><input id="dashboard-room-search" type="search" value="' + attr(state.dashboardRoomSearch || '') + '" placeholder="Cari ruangan" oninput="applyDashboardRoomFilters_()"></label></div>' +
      '<div id="dashboard-room-grid" class="room-status-grid">' + (roomCards || '<div class="dashboard-empty">Tidak ada ruangan aktif.</div>') + '</div>' +

      '<footer class="status-legend"><span class="finding">' + statusSymbol_('finding') + 'Ada temuan</span><span class="pending">' + statusSymbol_('pending') + 'Belum lengkap</span><span class="done">' + statusSymbol_('done') + 'Selesai</span><span class="neutral">' + statusSymbol_('neutral') + 'Tidak dijadwalkan</span></footer></article>';
    var attentionCard = '<article class="dashboard-card attention-card"><header><div><div class="dashboard-section-kicker danger">Tindak lanjut</div><h2>Perlu perhatian</h2><p>Temuan dan jadwal yang belum selesai hari ini.</p></div><strong class="panel-count">' + Number(dash.attentionTotal || (dash.attention || []).length) + '</strong></header>' +
      '<div class="attention-filters" aria-label="Filter daftar perhatian">' + attentionFilters + '</div><div id="dashboard-attention-grid" class="attention-grid">' + attention +

      '<footer id="dashboard-attention-footer" class="dashboard-card-action"><button type="button" class="btn btn-quiet btn-sm" onclick="openDashboardAttentionList_()">Buka daftar lengkap</button></footer></article>';
    var recentCard = '<article class="dashboard-card recent-card"><header><div><div class="dashboard-section-kicker">Aktivitas periode</div><h2>Aktivitas terbaru</h2><p>Menampilkan maksimal 12 dari ' + Number(dash.recentTotal || (dash.recent || []).length) + ' pemeriksaan pada ' + esc(formatMonthKey_(dash.month)) + '.</p></div></header><div class="recent-groups">' +
      (recent || '<div class="dashboard-empty">Belum ada pemeriksaan pada periode ini.</div>') + '</div></article>';
    var periodHeading = '<header class="dashboard-analysis-heading"><div><div class="dashboard-section-kicker">Analisis periode</div><h2>' + esc(formatMonthKey_(dash.month)) + '</h2><p>Tren operasional dan suara pengguna mengikuti periode serta ruangan yang dipilih.</p></div><div class="dashboard-period-totals"><span><strong>' + Number((dash.totals || {}).submissions || 0) + '</strong>Pemeriksaan</span><span><strong>' + Number((dash.totals || {}).clean || 0) + '</strong>Bersih</span><span class="finding"><strong>' + Number((dash.totals || {}).findings || 0) + '</strong>Dengan temuan</span></div></header>';
    root.innerHTML = '<section class="dashboard-hero"><div><div class="eyebrow">Operasional hari ini</div>' +
      '<h1>Ringkasan operasional</h1><p class="dashboard-date"><span class="dashboard-date-label">Hari ini</span><strong>' + esc(formatLongDateKey_(dash.todayKey)) + '</strong></p><p class="dashboard-freshness"><i></i>' + (state.presentationMode ? 'Pembaruan otomatis' : 'Data terbaru') + ' · ' + esc(formatDashboardUpdated_(dash.generatedAt)) + ' WIB</p></div></section>' +
      '<form class="dashboard-control-strip" onsubmit="refreshDashboard();return false;"><div class="dashboard-control-copy"><span>Cakupan data</span><strong>' + esc(dashboardScopeLabel_(dash)) + '</strong><small>Ruangan berlaku untuk seluruh ringkasan; bulan hanya untuk bagian analisis periode.</small></div><label class="filter-control"><span>Ruangan</span><select id="dash-room"><option value="">Semua ruangan</option>' + dash.rooms.map(function(room) {
        return '<option value="' + attr(room.roomId) + '"' + (dash.roomId === room.roomId ? ' selected' : '') + '>' + esc(room.name) + '</option>';
      }).join('') + '</select></label><label class="filter-control"><span>Periode analisis</span><input id="dash-month" type="month" value="' + attr(dash.month) + '"></label><button id="dashboard-filter-button" class="btn btn-primary filter-action" type="submit">Terapkan</button></form>' +
      '<section class="dashboard-metrics" aria-label="Ringkasan hari ini">' +
      '<button type="button" class="dashboard-metric completion' + (state.dashboardRoomFilter === 'ALL' ? ' active' : '') + '" onclick="setDashboardRoomFilter_(\'ALL\')"><span>Penyelesaian jadwal hari ini</span><strong>' + Number(totals.completionRate || 0) + '%</strong><small><i></i>' + Number(totals.completed || 0) + ' dari ' + Number(totals.expected || 0) + ' jadwal harian</small></button>' +
      '<button type="button" class="dashboard-metric done' + (state.dashboardRoomFilter === 'COMPLETE' ? ' active' : '') + '" onclick="setDashboardRoomFilter_(\'COMPLETE\')"><span>Ruangan lengkap</span><strong>' + Number(totals.completeRooms || 0) + '<em>/' + Number(totals.scheduledRooms || 0) + '</em></strong><small><i></i>Seluruh jadwal ruangan selesai</small></button>' +
      '<button type="button" class="dashboard-metric finding' + (state.dashboardRoomFilter === 'FINDING' ? ' active' : '') + '" onclick="setDashboardRoomFilter_(\'FINDING\');setDashboardAttentionFilter_(\'FINDING\')"><span>Pemeriksaan dengan temuan</span><strong>' + Number(totals.findings || 0) + '</strong><small><i></i>' + Number(totals.findingIndicators || 0) + ' indikator perlu ditinjau</small></button>' +
      '<button type="button" class="dashboard-metric pending' + (state.dashboardRoomFilter === 'INCOMPLETE' ? ' active' : '') + '" onclick="setDashboardRoomFilter_(\'INCOMPLETE\');setDashboardAttentionFilter_(\'PENDING\')"><span>Jadwal belum selesai</span><strong>' + Number(totals.pending || 0) + '</strong><small><i></i>' + Number(totals.pendingRooms || 0) + ' ruangan belum lengkap</small></button></section>' +
      (state.presentationMode ? '<section class="presentation-top-grid" aria-label="Ringkasan presentasi">' + renderDashboardSatisfaction_(dash.satisfaction) + renderPresentationTrend_(dash.daily) + '</section>' : '') +
      '<section class="dashboard-board"><div class="dashboard-main-column">' + roomStatusCard + '</div><div class="dashboard-side">' + attentionCard + (state.presentationMode ? recentCard : '') + '</div></section>' +
      (state.presentationMode ? '' : '<section class="dashboard-analysis">' + periodHeading + '<div class="dashboard-insight-grid">' + renderDashboardSatisfaction_(dash.satisfaction) + renderPresentationTrend_(dash.daily) + '</div>' + recentCard + '</section>');
    applyDashboardRoomFilters_();
    applyDashboardAttentionFilter_();
    window.requestAnimationFrame(syncDashboardAttentionHeight_);

  function dashboardRoomState_(room) {
    if (!room || !room.scheduled) return 'neutral';
    if ((room.groups || []).some(function(group) { return group.status === 'FINDING'; })) return 'finding';
    if (Number(room.completedCount || 0) < Number(room.expectedCount || 0)) return 'pending';
    return 'done';
  }

  function dashboardRoomStateLabel_(type) {
    return ({ finding: 'Ada temuan', pending: 'Belum lengkap', done: 'Selesai', neutral: 'Tidak dijadwalkan' })[type] || 'Status';
  }

  function renderDashboardRoomCard_(room) {
    var type = dashboardRoomState_(room);
    var expected = Number(room.expectedCount || 0);
    var completed = Number(room.completedCount || 0);
    var progress = expected ? Math.min(100, Math.round(completed / expected * 100)) : 0;
    return '<article class="room-status-item ' + type + '" data-room-status="' + type + '" data-room-name="' + attr(String(room.roomName || '').toLowerCase()) + '"><header><div><strong>' + esc(room.roomName) + '</strong><span>' + esc(roomTypeLabel_(room.roomTypeId)) +
      '</span></div><span class="room-state ' + type + '">' + statusSymbol_(type) + dashboardRoomStateLabel_(type) + '</span></header><div class="room-progress-line"><span><i style="width:' + progress + '%"></i></span><strong>' + completed + '/' + expected + '</strong></div>' +
      '<div class="room-shift-grid"><div><small>Pagi</small>' + dashboardStatusMarkup_(dashboardGroup_(room, 'morning')) + '</div>' +
      '<div><small>Sore</small>' + dashboardStatusMarkup_(dashboardGroup_(room, 'afternoon')) + '</div>' +
      '<div><small>Inspeksi</small>' + dashboardStatusMarkup_(dashboardGroup_(room, 'inspection')) + '</div></div></article>';
  }

  function renderDashboardAttentionTile_(item) {
    var type = item.kind === 'FINDING' ? 'finding' : 'pending';
    var action = item.inspectionId ? '<button type="button" class="attention-detail-button" onclick="openDashboardInspection_(\'' + attr(item.inspectionId) + '\')">Buka detail</button>' : '';
    return '<article class="attention-tile ' + type + '" data-attention-kind="' + attr(item.kind || '') + '"><span class="attention-icon">' + statusSymbol_(type) +
      '</span><div><strong>' + esc(item.title) + '</strong><span>' + esc(item.description) +
      '</span><footer>' + (item.time ? '<time>' + esc(item.time) + ' WIB</time>' : '<span>Belum selesai</span>') + action + '</footer></div></article>';
  }

  function setDashboardRoomFilter_(filter) {
    state.dashboardRoomFilter = filter || 'ALL';
    document.querySelectorAll('[data-room-filter-button]').forEach(function(button) {
      button.classList.toggle('active', button.getAttribute('data-room-filter-button') === state.dashboardRoomFilter);
    });
    document.querySelectorAll('.dashboard-metric').forEach(function(card) { card.classList.remove('active'); });
    var map = { ALL: 'completion', COMPLETE: 'done', FINDING: 'finding', INCOMPLETE: 'pending' };
    var metric = document.querySelector('.dashboard-metric.' + map[state.dashboardRoomFilter]);
    if (metric) metric.classList.add('active');
    applyDashboardRoomFilters_();
    var section = document.querySelector('.room-status-card');
    if (section && !state.presentationMode) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function applyDashboardRoomFilters_() {
    var input = document.getElementById('dashboard-room-search');
    if (input) state.dashboardRoomSearch = String(input.value || '').trim().toLowerCase();
    var visible = 0;
    document.querySelectorAll('#dashboard-room-grid .room-status-item').forEach(function(card) {
      var status = card.getAttribute('data-room-status');
      var matchesFilter = state.dashboardRoomFilter === 'ALL' ||
        (state.dashboardRoomFilter === 'FINDING' && status === 'finding') ||
        (state.dashboardRoomFilter === 'INCOMPLETE' && status === 'pending') ||
        (state.dashboardRoomFilter === 'COMPLETE' && status === 'done');
      var matchesSearch = !state.dashboardRoomSearch || String(card.getAttribute('data-room-name') || '').indexOf(state.dashboardRoomSearch) !== -1;
      card.hidden = !(matchesFilter && matchesSearch);
      if (!card.hidden) visible++;
    });
    var count = document.getElementById('dashboard-room-visible-count');
    var empty = document.getElementById('dashboard-room-empty');
    if (count) count.textContent = visible;
    if (empty) empty.hidden = visible > 0;
    var roomGrid = document.getElementById('dashboard-room-grid');
    if (roomGrid) roomGrid.scrollTop = 0;
    window.requestAnimationFrame(syncDashboardAttentionHeight_);
  }

  function setDashboardAttentionFilter_(filter) {
    state.dashboardAttentionFilter = filter || 'ALL';
    document.querySelectorAll('[data-attention-filter-button]').forEach(function(button) {
      button.classList.toggle('active', button.getAttribute('data-attention-filter-button') === state.dashboardAttentionFilter);
    });
    applyDashboardAttentionFilter_();
  }

  function applyDashboardAttentionFilter_() {
    var matching = [];
    var tiles = document.querySelectorAll('#dashboard-attention-grid .attention-tile');
    tiles.forEach(function(tile) {
      var kind = tile.getAttribute('data-attention-kind');
      var visible = state.dashboardAttentionFilter === 'ALL' || kind === state.dashboardAttentionFilter;
      tile.hidden = !visible;
      if (visible) matching.push(tile);
    });
    var empty = document.getElementById('dashboard-attention-empty');
    var footer = document.getElementById('dashboard-attention-footer');
    if (empty) {
      var emptyMessages = {
        FINDING: ['Tidak ada temuan hari ini', 'Tidak ada pemeriksaan dengan temuan pada cakupan yang dipilih.'],
        PENDING: ['Semua jadwal sudah selesai', 'Tidak ada jadwal yang belum selesai pada cakupan yang dipilih.'],
        ALL: ['Tidak ada tindak lanjut hari ini', 'Semua pemeriksaan pada cakupan ini sudah lengkap tanpa temuan.']
      };
      var message = emptyMessages[state.dashboardAttentionFilter] || emptyMessages.ALL;
      var title = document.getElementById('dashboard-attention-empty-title');
      var copy = document.getElementById('dashboard-attention-empty-copy');
      var action = document.getElementById('dashboard-attention-empty-action');
      if (title) title.textContent = message[0];
      if (copy) copy.textContent = message[1];
      if (action) action.hidden = state.dashboardAttentionFilter === 'ALL' || tiles.length === 0;
      empty.hidden = matching.length > 0;
    }
    if (footer) {
      footer.hidden = matching.length === 0;
      var button = footer.querySelector('button');
      if (button) button.textContent = 'Buka daftar lengkap · ' + matching.length + ' item';
    }
    var grid = document.getElementById('dashboard-attention-grid');
    if (grid) grid.scrollTop = 0;
  }

  function syncDashboardAttentionHeight_() {
    var statusCard = document.querySelector('.room-status-card');
    var attentionCard = document.querySelector('.dashboard-side > .attention-card');
    if (!statusCard || !attentionCard) return;
    if (state.presentationMode) {
      attentionCard.style.height = '';
      statusCard.style.height = '';
      return;
    }
    var h = window.innerWidth > 1180 ? '540px' : '500px';
    statusCard.style.height = h;
    attentionCard.style.height = h;
  }

  function openDashboardAttentionList_(filter) {
    var dash = state.bootstrap && state.bootstrap.dashboard ? state.bootstrap.dashboard : {};
    var counts = dash.attentionCounts || { findings: 0, pending: 0 };
    var activeFilter = filter || state.dashboardAttentionFilter || 'ALL';
    var items = (dash.attention || []).filter(function(item) {
      return activeFilter === 'ALL' || item.kind === activeFilter;
    });
    var filters = [
      ['ALL', 'Semua', Number(dash.attentionTotal || (dash.attention || []).length)],
      ['FINDING', 'Temuan', Number(counts.findings || 0)],
      ['PENDING', 'Belum selesai', Number(counts.pending || 0)]
    ].map(function(item) {
      return '<button type="button" class="attention-filter' + (activeFilter === item[0] ? ' active' : '') + '" onclick="openDashboardAttentionList_(\'' + item[0] + '\')"><span>' + item[1] + '</span><strong>' + item[2] + '</strong></button>';
    }).join('');
    var list = items.map(renderDashboardAttentionTile_).join('');
    showModal('Daftar tindak lanjut', '<div class="attention-modal-intro"><strong>' + items.length + ' item ditampilkan</strong><span>Pilih kategori untuk mempersempit daftar.</span></div><div class="attention-filters attention-modal-filters">' + filters + '</div><div class="attention-modal-list">' +
      (list || '<div class="dashboard-empty">Tidak ada item pada kategori ini.</div>') + '</div>', '<button class="btn btn-secondary" onclick="closeModal()">Tutup</button>', 'dashboard-attention-modal');
  }

  function dashboardScopeLabel_(dash) {
    if (!dash.roomId) return 'Semua ruangan';
    var room = (dash.rooms || []).find(function(item) { return String(item.roomId) === String(dash.roomId); });
    return room ? room.name : 'Ruangan terpilih';
  }

  function formatMonthKey_(monthKey) {
    var parts = String(monthKey || '').split('-');
    var months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    return parts.length === 2 ? (months[Number(parts[1]) - 1] || parts[1]) + ' ' + parts[0] : monthKey || '';
  }

  function formatDashboardUpdated_(value) {
    if (!value) return '--.--';
    try { return new Intl.DateTimeFormat('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Jakarta' }).format(new Date(value)).replace('.', ':'); }
    catch (error) { return String(value).slice(11, 16) || '--.--'; }
  }

  state.inspectionCache = state.inspectionCache || {};

  async function openDashboardInspection_(inspectionId) {
    if (!inspectionId) return;
    showModal('Detail pemeriksaan', loadingSkeleton_('Membuka detail pemeriksaan', 'Memuat indikator, catatan, dan foto evidence...'), '<button class="btn btn-secondary" onclick="closeModal()">Tutup</button>', 'dashboard-detail-modal');
    try {
      var data = state.inspectionCache[inspectionId];
      if (!data) {
        data = await apiCall('getInspection', { inspectionId: inspectionId });
        state.inspectionCache[inspectionId] = data;
      }
      var summary = data.summary || {};
      var issues = (data.details || []).filter(function(detail) {
        return ['NEGATIVE','TIDAK_BERSIH'].indexOf(String(detail.qualityResult || '').toUpperCase()) !== -1 ||
          ['NEGATIVE','TIDAK_BERFUNGSI'].indexOf(String(detail.functionResult || '').toUpperCase()) !== -1;
      });
      var issueMarkup = issues.map(function(detail) {
        var results = [];
        if (String(detail.qualityResult || '').toUpperCase() !== 'NA') results.push(detail.qualityLabel || detail.qualityResult);
        if (String(detail.functionResult || '').toUpperCase() !== 'NA') results.push(detail.functionLabel || detail.functionResult);
        return '<article class="dashboard-detail-issue"><div><strong>' + esc(detail.activityName || 'Indikator kebersihan') + '</strong><span>' + esc(results.join(' · ')) + '</span></div>' + (detail.note ? '<p>' + esc(detail.note) + '</p>' : '') + '</article>';
      }).join('');
      var body = document.querySelector('#modal-root .modal-body');
      if (!body) return;
      var isSubmitted = String(summary.state || '').toUpperCase() !== 'REOPENED';
      var statusNotice = !isSubmitted
        ? '<div style="margin-top:16px;padding:12px 16px;border:1px solid #fed7aa;border-radius:12px;background:#fff7ed;color:#9a3412;font-size:12px">Pemeriksaan ini sedang dalam status <strong>DIBUKA KEMBALI</strong> untuk diisi ulang oleh petugas.</div>'
        : '';

      body.innerHTML = '<div class="dashboard-detail-summary"><div><span>Ruangan</span><strong>' + esc(summary.roomName || (data.room || {}).name || '-') + '</strong></div><div><span>Slot</span><strong>' + esc(summary.slotName || (data.slot || {}).name || '-') + '</strong></div><div><span>Petugas</span><strong>' + esc(summary.officerName || '-') + '</strong></div><div><span>Waktu</span><strong>' + esc(summary.displayTime || '-') + ' WIB</strong></div></div>' +
        '<section class="dashboard-detail-section"><header><div><span>Indikator bermasalah</span><strong>' + issues.length + ' temuan</strong></div></header><div class="dashboard-detail-issues">' + (issueMarkup || '<div class="dashboard-empty">Tidak ada rincian indikator bermasalah.</div>') + '</div></section>' +
        '<section class="dashboard-detail-section"><header><div><span>Evidence pemeriksaan</span><strong>' + Number((data.photos || []).length) + ' foto</strong></div></header><div id="dashboard-evidence-grid" class="dashboard-evidence-grid"><div class="dashboard-evidence-loading">Menyiapkan evidence...</div></div></section>' +
        statusNotice;

      var modalFoot = document.querySelector('#modal-root .modal-foot');
      if (modalFoot) {
        modalFoot.innerHTML = (isSubmitted ? '<button type="button" class="btn btn-danger" onclick="confirmReopenInspection_(\'' + jsq(inspectionId) + '\')">Buka kembali pemeriksaan ini</button>' : '') +
          '<button class="btn btn-secondary" onclick="closeModal()">Tutup</button>';
      }
      loadDashboardEvidence_(data.photos || []);
    } catch (error) {
      var body = document.querySelector('#modal-root .modal-body');

  function loadDashboardEvidence_(photos) {

    if (allHaveDataUrl) {

        return '<figure><img src="' + attr(photo.dataUrl) + '" alt="Foto evidence ' + (index + 1) + '" loading="eager"><figcaption>Evidence ' + (index + 1) + '</figcaption></figure>';
      }).join('');

    }
    Promise.all(photos.map(function(photo) {

      return apiCall('getPhoto', { fileId: photo.fileId }).then(function(result) { return { ok: true, data: result }; }, function() { return { ok: false, name: photo.fileName || 'Evidence' }; });
    })).then(function(results) {

      }).join('');

  function renderPresentationTrend_(daily) {
    var points = Array.isArray(daily) ? daily : [];
    var width = 960;
    var height = 228;
    var left = 42;
    var right = 18;
    var top = 22;
    var bottom = 34;
    var plotWidth = width - left - right;
    var plotHeight = height - top - bottom;
    var maxValue = points.reduce(function(max, item) {
      return Math.max(max, Number(item.submissions || 0), Number(item.findings || 0));
    }, 0);
    if (!points.length || !maxValue) {
      return '<article class="presentation-trend-card"><header><div><span class="presentation-trend-kicker">Tren operasional</span><h2>Belum ada pemeriksaan pada periode ini</h2><p>Grafik akan terisi setelah kiriman pemeriksaan masuk.</p></div></header><div class="presentation-trend-empty">Menunggu data pemeriksaan</div></article>';
    }
    var groupWidth = plotWidth / points.length;
    var barWidth = Math.max(4, Math.min(18, groupWidth * .42));
    var bars = '';
    var labels = '';
    var labelStep = Math.max(1, Math.ceil(points.length / 8));
    points.forEach(function(item, index) {
      var total = Number(item.submissions || 0);
      var findings = Number(item.findings || 0);
      var center = left + groupWidth * index + groupWidth / 2;
      var totalHeight = total ? Math.max(3, total / maxValue * plotHeight) : 0;
      var findingHeight = findings ? Math.max(3, findings / maxValue * plotHeight) : 0;
      var totalX = center - barWidth - 2;
      var findingX = center + 2;
      bars += '<rect class="presentation-trend-bar total" x="' + totalX.toFixed(2) + '" y="' + (top + plotHeight - totalHeight).toFixed(2) + '" width="' + barWidth.toFixed(2) + '" height="' + totalHeight.toFixed(2) + '" rx="3"><title>' + esc(item.day + ': ' + total + ' pemeriksaan') + '</title></rect>';
      bars += '<rect class="presentation-trend-bar finding" x="' + findingX.toFixed(2) + '" y="' + (top + plotHeight - findingHeight).toFixed(2) + '" width="' + barWidth.toFixed(2) + '" height="' + findingHeight.toFixed(2) + '" rx="3"><title>' + esc(item.day + ': ' + findings + ' temuan') + '</title></rect>';
      if (index % labelStep === 0 || index === points.length - 1) {
        labels += '<text class="presentation-trend-axis-label" x="' + center.toFixed(2) + '" y="' + (height - 9) + '" text-anchor="middle">' + esc(String(item.day)) + '</text>';
      }
    });
    var grid = '';
    [0, .5, 1].forEach(function(ratio) {
      var y = top + plotHeight - plotHeight * ratio;
      var value = Math.round(maxValue * ratio);
      grid += '<line class="presentation-trend-grid" x1="' + left + '" y1="' + y.toFixed(2) + '" x2="' + (width - right) + '" y2="' + y.toFixed(2) + '"></line><text class="presentation-trend-y-label" x="' + (left - 10) + '" y="' + (y + 4).toFixed(2) + '" text-anchor="end">' + value + '</text>';
    });
    return '<article class="presentation-trend-card"><header><div><span class="presentation-trend-kicker">Tren operasional</span><h2>Aktivitas pemeriksaan bulan ini</h2><p>Jumlah kiriman harian dan temuan yang perlu ditindaklanjuti.</p></div><div class="presentation-trend-legend"><span><i class="total"></i>Pemeriksaan</span><span><i class="finding"></i>Temuan</span></div></header><div class="presentation-trend-chart"><svg viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="Tren pemeriksaan harian"><title>Tren pemeriksaan harian</title>' + grid + bars + labels + '</svg></div></article>';
  }

  function enhanceAllSelects_(root) {
    (root || document).querySelectorAll('select:not([data-themed-select])').forEach(function(select) {
      select.setAttribute('data-themed-select', 'true');

      trigger.className = 'themed-select-trigger';

      trigger.onclick = function(event) { toggleThemedSelect_(event, control); };
      var menu = document.createElement('div');
      menu.className = 'themed-select-menu';
      menu.setAttribute('role', 'listbox');

          var query = String(searchInput.value || '').trim().toLowerCase();
          menu.querySelectorAll('.themed-select-option').forEach(function(optionButton) {
            optionButton.hidden = query && optionButton.textContent.toLowerCase().indexOf(query) === -1;
          });
        };
        searchBox.appendChild(searchInput);
        menu.appendChild(searchBox);
      }
      Array.prototype.forEach.call(select.options, function(option) {
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'themed-select-option' + (option.selected ? ' selected' : '');
        button.disabled = option.disabled;
        button.setAttribute('role', 'option');
        button.setAttribute('data-value', option.value);
        button.innerHTML = '<span>' + esc(option.textContent) + '</span><b>' + (option.selected ? '✓' : '') + '</b>';
        button.onclick = function(event) { chooseThemedOption_(event, control, select, option.value, option.textContent); };
        menu.appendChild(button);
      });
      var selected = select.options[select.selectedIndex] || select.options[0];
      trigger.querySelector('span').textContent = selected ? selected.textContent : 'Pilih';
      control.appendChild(trigger);
      control.appendChild(menu);

  function closeThemedSelects_() {
    document.querySelectorAll('.themed-select.open').forEach(function(control) {
      control.classList.remove('open');
      control.querySelector('.themed-select-trigger').setAttribute('aria-expanded', 'false');
    });
    document.querySelectorAll('.themed-date.open').forEach(function(control) {
      control.classList.remove('open');
      control.querySelector('.themed-date-trigger').setAttribute('aria-expanded', 'false');
    });
  }

  function toggleThemedSelect_(event, control) {
    event.stopPropagation();
    var willOpen = !control.classList.contains('open');
    closeThemedSelects_();
    if (!willOpen) return;
    var trigger = control.querySelector('.themed-select-trigger');
    var menu = control.querySelector('.themed-select-menu');
    var box = trigger.getBoundingClientRect();
    var availableBelow = window.innerHeight - box.bottom;
    menu.style.left = Math.max(8, box.left) + 'px';
    menu.style.width = box.width + 'px';
    menu.style.top = (availableBelow < 220 ? Math.max(8, box.top - Math.min(280, menu.scrollHeight || 280) - 8) : box.bottom + 8) + 'px';
    control.classList.add('open');
    trigger.setAttribute('aria-expanded', 'true');
    var search = menu.querySelector('.themed-select-search input');
    if (search) window.setTimeout(function() { search.focus(); }, 0);
  }

  function chooseThemedOption_(event, control, select, value, label) {
    event.stopPropagation();
    select.value = value;
    control.querySelector('.themed-select-trigger span').textContent = label;
    control.querySelectorAll('.themed-select-option').forEach(function(option) {
      var active = String(option.getAttribute('data-value')) === String(value);
      option.classList.toggle('selected', active);
      option.querySelector('b').textContent = active ? '✓' : '';
    });
    closeThemedSelects_();
    select.dispatchEvent(new Event('change', { bubbles: true }));
  }

  function enhanceAllDateInputs_(root) {
    (root || document).querySelectorAll('input[type="date"]:not([data-themed-date]),input[type="month"]:not([data-themed-date])').forEach(function(input) {
      input.setAttribute('data-themed-date', 'true');

      trigger.onclick = function(event) { toggleThemedDate_(event, control, input); };

  function syncThemedDateControl_(input) {
    if (!input || !input.nextElementSibling || !input.nextElementSibling.classList.contains('themed-date')) return;
    var label = 'Pilih tanggal';
    if (input.value) {
      var parts = input.value.split('-').map(Number);
      var options = input.type === 'month' ? { month: 'long', year: 'numeric' } : { day: '2-digit', month: 'long', year: 'numeric' };
      label = new Intl.DateTimeFormat('id-ID', options).format(new Date(parts[0], parts[1] - 1, parts[2] || 1));
    }
    input.nextElementSibling.querySelector('.themed-date-trigger span').textContent = label;
  }

  function toggleThemedDate_(event, control, input) {
    event.stopPropagation();
    var willOpen = !control.classList.contains('open');
    closeThemedSelects_();
    if (!willOpen) return;
    var valueParts = String(input.value || '').split('-').map(Number);
    var now = new Date();
    control._viewYear = valueParts[0] || now.getFullYear();
    control._viewMonth = valueParts[1] ? valueParts[1] - 1 : now.getMonth();
    renderThemedDateMenu_(control, input);
    var trigger = control.querySelector('.themed-date-trigger');
    var menu = control.querySelector('.themed-date-menu');
    var box = trigger.getBoundingClientRect();
    var estimatedHeight = input.type === 'month' ? 250 : 340;
    menu.style.left = Math.max(8, Math.min(box.left, window.innerWidth - Math.max(288, box.width) - 8)) + 'px';
    menu.style.width = Math.max(288, box.width) + 'px';
    menu.style.top = (window.innerHeight - box.bottom < estimatedHeight ? Math.max(8, box.top - estimatedHeight - 8) : box.bottom + 8) + 'px';
    control.classList.add('open');
    trigger.setAttribute('aria-expanded', 'true');
  }

  function renderThemedDateMenu_(control, input) {
    var menu = control.querySelector('.themed-date-menu');
    var months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    var selected = String(input.value || '');
    var heading = input.type === 'month' ? String(control._viewYear) : months[control._viewMonth] + ' ' + control._viewYear;
    menu.innerHTML = '<header><button type="button" aria-label="Sebelumnya">‹</button><strong>' + esc(heading) + '</strong><button type="button" aria-label="Berikutnya">›</button></header><div class="themed-calendar-body"></div>';
    var nav = menu.querySelectorAll('header button');
    nav[0].onclick = function(event) { event.stopPropagation(); shiftThemedDateView_(control, input, -1); };
    nav[1].onclick = function(event) { event.stopPropagation(); shiftThemedDateView_(control, input, 1); };
    var body = menu.querySelector('.themed-calendar-body');
    if (input.type === 'month') {
      body.className += ' month-grid';
      months.forEach(function(label, monthIndex) {
        var value = control._viewYear + '-' + String(monthIndex + 1).padStart(2, '0');
        var button = document.createElement('button');
        button.type = 'button'; button.textContent = label.slice(0, 3); button.className = value === selected ? 'selected' : '';
        button.onclick = function(event) { chooseThemedDate_(event, control, input, value); };
        body.appendChild(button);
      });
      return;
    }
    body.className += ' date-grid';
    ['Sen','Sel','Rab','Kam','Jum','Sab','Min'].forEach(function(day) {
      var item = document.createElement('span'); item.textContent = day; body.appendChild(item);
    });
    var first = new Date(control._viewYear, control._viewMonth, 1);
    var offset = (first.getDay() + 6) % 7;
    var days = new Date(control._viewYear, control._viewMonth + 1, 0).getDate();
    for (var blank = 0; blank < offset; blank++) body.appendChild(document.createElement('i'));
    for (var dayNumber = 1; dayNumber <= days; dayNumber++) {
      (function(day) {
        var value = control._viewYear + '-' + String(control._viewMonth + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
        var button = document.createElement('button');
        button.type = 'button'; button.textContent = day; button.className = value === selected ? 'selected' : '';
        button.onclick = function(event) { chooseThemedDate_(event, control, input, value); };
        body.appendChild(button);
      })(dayNumber);
    }
  }

  function shiftThemedDateView_(control, input, direction) {
    if (input.type === 'month') control._viewYear += direction;
    else {
      control._viewMonth += direction;
      if (control._viewMonth < 0) { control._viewMonth = 11; control._viewYear--; }
      if (control._viewMonth > 11) { control._viewMonth = 0; control._viewYear++; }
    }
    renderThemedDateMenu_(control, input);
  }

  }

  function formatLongDateKey_(dateKey) {

  function currentMonthPeriod_() {

  function setSatisfactionPreset_(days) {
    var end = new Date();
    var start = new Date();
    if (days === 1 || days === '1' || days === 'today') {
      start = new Date();
      end = new Date();
    } else if (days === 'month') {
      var monthPeriod = currentMonthPeriod_();
      var startInput = document.getElementById('satisfaction-start');
      var endInput = document.getElementById('satisfaction-end');
      if (startInput) { startInput.value = monthPeriod.start; syncThemedDateControl_(startInput); }
      if (endInput) { endInput.value = monthPeriod.end; syncThemedDateControl_(endInput); }
      return loadEvaluationReport_();
    } else {
      start = new Date(end.getTime() - (Number(days) - 1) * 86400000);
    }
    var startInput = document.getElementById('satisfaction-start');
    var endInput = document.getElementById('satisfaction-end');
    if (startInput) { startInput.value = localDateKey_(start); syncThemedDateControl_(startInput); }
    if (endInput) { endInput.value = localDateKey_(end); syncThemedDateControl_(endInput); }
    loadEvaluationReport_();
  }

      '<section class="panel satisfaction-history"><div class="panel-head"><div><h2>Histori evaluasi</h2><div class="field-hint">Waktu tercatat · Identitas pengisi tidak dicatat · Petugas terakhir = monitoring terakhir sebelum evaluasi dikirim.</div></div><div class="satisfaction-export-actions"><button class="btn btn-secondary btn-sm" onclick="exportEvaluationReport_(\'excel\')">Unduh Excel</button><button class="btn btn-primary btn-sm" onclick="exportEvaluationReport_(\'pdf\')">Unduh PDF</button></div></div>' +

  function calculateXAxisTicks_(maxVal) {
    maxVal = Math.max(1, Number(maxVal || 0));
    var step = 1;
    if (maxVal <= 5) step = 1;
    else if (maxVal <= 15) step = 3;
    else if (maxVal <= 30) step = 5;
    else if (maxVal <= 60) step = 10;
    else if (maxVal <= 120) step = 20;
    else if (maxVal <= 250) step = 50;
    else step = Math.ceil(maxVal / 5 / 10) * 10;

    var max = Math.ceil(maxVal / step) * step;
    if (max === maxVal && maxVal > 5) max += step;
    var ticks = [];
    for (var i = 0; i <= max; i += step) ticks.push(i);
    return { max: max, step: step, ticks: ticks };
  }

  function renderOfficerPerformance_(data, targetId) {
    targetId = targetId || (state.adminTab === 'performance' ? 'performance-report-root' : 'satisfaction-report-root');

            '<div class="officer-avatar">' + initials + '</div>' +
            '<div class="officer-bar-name">' +
              '<strong>' + esc(officer.officerName) + '</strong>' +

      '<div class="panel-head">' +
        '<div><h2>Cakupan target sesi monitoring per ruangan</h2><div class="field-hint">Memperhitungkan frekuensi wajib per hari (Toilet 3x: Pagi/Siang/Sore · Ruangan lain 2x: Pagi/Sore). Total target periode ini: ' + sessionCov.totalTargetSessions + ' sesi.</div></div>' +

      var coverageBar = '<div class="officer-clean-rate-bar"><i style="width:' + officer.coverageRate + '%;background:var(--success)"></i><span>' + officer.coverageRate + '%</span></div>';

        ? officer.evalSatisfactionRate + '%'
        : '<span class="field-hint">—</span>';

        '<td><strong>' + esc(officer.officerName) + '</strong><br><small>' + timeIcon + '</small></td>' +
        '<td class="num"><strong>' + officer.total + '</strong></td>' +
        '<td class="num">' + officer.clean + '</td>' +
        '<td class="num">' + officer.findings + '</td>' +
        '<td>' + cleanBar + '</td>' +
        '<td class="num">' + ratingCell + '</td>' +
        '<td class="num">' + satCell + '</td>' +

    // ── 6. Per-officer detail cards (Accordion) ──

        var rdBar = '<div class="officer-clean-rate-bar"><i style="width:' + rd.cleanRate + '%"></i><span>' + rd.cleanRate + '%</span></div>';
        return '<tr><td>' + esc(rd.roomName) + '</td>' +
          '<td class="num">' + rd.inspections + 'x</td>' +
          '<td class="num">' + rd.clean + '</td>' +
          '<td class="num">' + rd.findings + '</td>' +

          '<td class="num">' + rd.daysVisited + ' hari<br><small>' + rd.visitFrequency + '% hari aktif</small></td>' +

      var evalRows = (officer.evaluations || []).map(function(ev) {

          '<td>' + esc(ev.comment || '—') + '</td>' +

      var uncoveredList = officer.roomsNotCovered.length
        ? officer.roomsNotCovered.map(function(r) { return '<span class="officer-uncovered-tag">' + esc(r.roomName) + '</span>'; }).join('')

      var ratingBadge = officer.evalCount
        ? '<span class="officer-badge officer-badge-star">★ ' + officer.evalAvgRating.toFixed(2) + ' (' + officer.evalCount + ' evaluasi)</span>'

        '<div class="officer-detail-header" onclick="toggleOfficerDetail_(\'' + cardId + '\')">' +
          '<div class="officer-detail-title">' +
            '<strong>' + esc(officer.officerName) + '</strong>' +

            '<span class="officer-badge">' + officer.total + ' pemeriksaan</span>' +
            '<span class="officer-badge officer-badge-cov">' + officer.coverageRate + '% coverage</span>' +
            (officer.roomsNotCovered.length ? '<span class="officer-badge officer-badge-warn">' + officer.roomsNotCovered.length + ' ruangan tidak tercover</span>' : '<span class="officer-badge officer-badge-ok">✓ Semua tercover</span>') +
          '</div>' +
          '<svg class="officer-detail-chevron" id="' + cardId + '-chev" viewBox="0 0 20 20" aria-hidden="true"><path d="m5 7.5 5 5 5-5"/></svg>' +
        '</div>' +
        '<div class="officer-detail-body" id="' + cardId + '">' +
          '<div class="officer-detail-section">' +
            '<h4>Statistik ringkas</h4>' +
            '<div class="officer-kpi-row">' +
              '<div><span>Rata-rata Rating</span><strong>★ ' + (officer.evalCount ? officer.evalAvgRating.toFixed(2) : '—') + '</strong></div>' +
              '<div><span>Total Evaluasi</span><strong>' + officer.evalCount + '</strong></div>' +
              '<div><span>Tingkat Kepuasan</span><strong>' + (officer.evalCount ? officer.evalSatisfactionRate + '%' : '—') + '</strong></div>' +
              '<div><span>Pagi / Siang / Sore</span><strong>' + officer.morningCount + ' / ' + (officer.noonCount || 0) + ' / ' + officer.afternoonCount + '</strong></div>' +
