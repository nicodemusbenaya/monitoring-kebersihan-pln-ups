<script>
  var state = {
    context: window.INITIAL_CONTEXT,
    sessionToken: localStorage.getItem('pln_ups_session') || '',
    bootstrap: null,
    scanned: null,
    selectedSlot: null,
    evidenceData: '',
    cameraStream: null,
    roomTokenConsumed: false,
    adminTab: 'dashboard',
    adminData: null
  };

  document.addEventListener('DOMContentLoaded', startApp);

  function apiCall(action, payload) {
    payload = payload || {};
    if (state.sessionToken && !payload.sessionToken) payload.sessionToken = state.sessionToken;
    return new Promise(function(resolve, reject) {
      google.script.run.withSuccessHandler(function(response) {
        if (response && response.ok) return resolve(response.data);
        var error = new Error(response && response.error ? response.error.message : 'Respons server tidak valid.');
        error.code = response && response.error ? response.error.code : 'SERVER_ERROR';
        reject(error);
      }).withFailureHandler(function(error) {
        reject(new Error(error && error.message ? error.message : 'Tidak dapat menghubungi server.'));
      }).api(action, payload);
    });
  }

  async function startApp() {
    if (!state.sessionToken) return renderLogin();
    await loadBootstrap();
  }

  async function loadBootstrap() {
    renderLoading();
    try {
      state.bootstrap = await apiCall('bootstrap', {});
      if (state.bootstrap.user.mustChangePassword) {
        renderHome();
        showPasswordModal(true);
        return;
      }
      if (state.bootstrap.mode !== 'ADMIN' && state.context.roomToken && !state.roomTokenConsumed) {
        state.roomTokenConsumed = true;
        await openScannedRoom('PLNUPS:ROOM:' + state.context.roomToken);
        return;
      }
      renderHome();
    } catch (error) {
      if (isSessionError(error)) clearSession();
      renderLogin(error.message);
    }
  }

  function renderLoading() {
    appRoot().innerHTML = '<div class="initial-loader"><div class="brand-mark"><img src="' +
      attr(state.context.logoUrl) + '" alt="Logo PLN"></div><div class="skeleton-line wide"></div><div class="skeleton-line"></div></div>';
  }

  function renderLogin(message) {
    appRoot().innerHTML =
      '<main class="login-layout"><section class="login-brand">' +
      '<div class="brand-mark"><img src="' + attr(state.context.logoUrl) + '" alt="Logo PLN"></div>' +
      '<div class="login-copy"><h1>Ruang bersih, kerja lebih baik.</h1>' +
      '<p>Monitoring kebersihan PLN UPS dengan pemeriksaan terjadwal dan bukti foto.</p></div>' +
      '<div class="room-chip">Masuk sekali, lalu pindai QR ruangan dari aplikasi</div></section>' +
      '<section class="login-panel"><div class="login-card"><h2>Masuk ke aplikasi</h2>' +
      '<p>Gunakan username dan password yang diberikan administrator.</p>' +
      (message ? '<div class="form-error">' + esc(message) + '</div>' : '') +
      '<form onsubmit="handleLogin(event)"><div class="field"><label>Username</label><input id="username" autocomplete="username" required autofocus></div>' +
      '<div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div>' +
      '<button id="login-button" class="btn btn-primary btn-block">Masuk</button></form></div></section></main>';
  }

  async function handleLogin(event) {
    event.preventDefault();
    var button = document.getElementById('login-button');
    button.disabled = true;
    try {
      var result = await apiCall('login', {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      });
      state.sessionToken = result.sessionToken;
      localStorage.setItem('pln_ups_session', state.sessionToken);
      await loadBootstrap();
    } catch (error) { renderLogin(error.message); }
  }

  function renderHome() {
    if (state.bootstrap.mode === 'ADMIN') renderAdmin();
    else renderScannerHome();
  }

  function renderHeader(subtitle) {
    var user = state.bootstrap.user;
    var config = state.bootstrap.app;
    return '<header class="topbar"><div class="topbar-inner"><div class="topbar-brand">' +
      '<img src="' + attr(config.logoUrl) + '" alt="Logo PLN"><span class="brand-divider"></span>' +
      '<div class="topbar-title"><strong>' + esc(config.name) + '</strong><span>' + esc(subtitle) + '</span></div></div>' +
      '<div class="user-area"><div class="user-copy"><strong>' + esc(user.fullName) + '</strong><span>' +
      esc(roleLabel(user.role)) + '</span></div><button class="btn btn-secondary btn-sm" onclick="logout()">Keluar</button></div></div></header>';
  }

  function renderScannerHome() {
    state.scanned = null;
    state.selectedSlot = null;
    state.evidenceData = '';
    appRoot().innerHTML = renderHeader('Pemindaian ruangan') +
      '<main class="page"><section class="room-banner"><div><div class="eyebrow" style="color:#ffd100">CHECKLIST HARIAN</div>' +
      '<h1>Pindai QR ruangan</h1><p>Pindai langsung dari aplikasi menggunakan kamera belakang HP.</p></div></section>' +
      '<section class="panel"><div class="panel-body"><div class="empty">' +
      '<strong>Belum ada ruangan terbuka.</strong><br>Arahkan kamera ke QR yang ditempel di ruangan.' +
      '<div style="margin-top:18px"><button type="button" class="btn btn-primary" onclick="startQrScanner()">Pindai QR Ruangan</button></div>' +
      '<div class="field-hint" style="margin-top:12px">Jika video kamera tidak tersedia, aplikasi akan menyediakan pilihan Ambil foto QR.</div>' +
      '</div></div></section></main>';
  }

  async function startQrScanner() {
    if (!window.jsQR) return toast('Pemindai QR belum dapat dimuat. Periksa koneksi internet.', 'error');
    showModal('Pindai QR ruangan',
      '<div class="camera-frame"><video id="qr-video" playsinline autoplay muted></video><canvas id="qr-canvas" class="hidden"></canvas></div>' +
      '<p class="field-hint">Arahkan kamera ke QR hingga terbaca otomatis.</p>' +
      '<div id="qr-camera-error"></div>' +
      '<div class="camera-fallback"><label class="btn btn-secondary" for="qr-photo-input">Ambil foto QR</label>' +
      '<input class="capture-input" id="qr-photo-input" type="file" accept="image/*" capture="environment" onchange="decodeQrPhoto(event)">' +
      '<div class="field-hint">Gunakan tombol ini jika video kamera tidak muncul.</div></div>',
      '<button class="btn btn-secondary" onclick="closeModal()">Batal</button>', 'modal-wide');
    try {
      state.cameraStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } }, audio: false
      });
      var video = document.getElementById('qr-video');
      video.srcObject = state.cameraStream;
      await video.play();
      scanVideoFrame(video);
    } catch (error) {
      stopCamera();
      var target = document.getElementById('qr-camera-error');
      if (target) target.innerHTML = '<div class="notice notice-warning">' + esc(cameraErrorMessage_(error)) +
        '<br>Gunakan tombol <strong>Ambil foto QR</strong> di bawah.</div>';
    }
  }

  async function decodeQrPhoto(event) {
    var file = event.target.files && event.target.files[0];
    if (!file) return;
    try {
      var nativeValue = await decodeQrNative_(file);
      if (nativeValue) {
        stopCamera(); closeModal(); openScannedRoom(nativeValue);
        return;
      }
      var image = await loadImageFile_(file);
      var canvas = document.getElementById('qr-canvas');
      var code = decodeQrImageMultiPass_(image, canvas);
      if (!code || !code.data) return toast('QR tidak terbaca. Ambil foto lebih dekat dan pastikan tidak buram.', 'error');
      stopCamera(); closeModal(); openScannedRoom(code.data);
    } catch (error) {
      toast('Foto QR tidak dapat diproses.', 'error');
    } finally {
      event.target.value = '';
    }
  }

  async function decodeQrNative_(file) {
    if (!window.BarcodeDetector || !window.createImageBitmap) return '';
    try {
      var supported = await BarcodeDetector.getSupportedFormats();
      if (supported.indexOf('qr_code') === -1) return '';
      var bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
      var results = await new BarcodeDetector({ formats: ['qr_code'] }).detect(bitmap);
      if (bitmap.close) bitmap.close();
      return results.length ? String(results[0].rawValue || '') : '';
    } catch (error) {
      return '';
    }
  }

  function decodeQrImageMultiPass_(image, canvas) {
    var maxSizes = [2400, 1600, 1000];
    var rotations = [0, 90, 180, 270];
    for (var s = 0; s < maxSizes.length; s++) {
      var scale = Math.min(1, maxSizes[s] / Math.max(image.width, image.height));
      var baseWidth = Math.max(1, Math.round(image.width * scale));
      var baseHeight = Math.max(1, Math.round(image.height * scale));
      for (var r = 0; r < rotations.length; r++) {
        var angle = rotations[r];
        var swap = angle === 90 || angle === 270;
        canvas.width = swap ? baseHeight : baseWidth;
        canvas.height = swap ? baseWidth : baseHeight;
        var ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(angle * Math.PI / 180);
        ctx.drawImage(image, -baseWidth / 2, -baseHeight / 2, baseWidth, baseHeight);
        ctx.restore();
        var pixels = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var result = jsQR(pixels.data, canvas.width, canvas.height, { inversionAttempts: 'attemptBoth' });
        if (result && result.data) return result;
      }
    }
    return null;
  }

  function scanVideoFrame(video) {
    if (!state.cameraStream || !document.getElementById('qr-canvas')) return;
    if (video.readyState >= 2 && video.videoWidth) {
      var canvas = document.getElementById('qr-canvas');
      var ctx = canvas.getContext('2d', { willReadFrequently: true });
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      var code = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height, {
        inversionAttempts: 'attemptBoth'
      });
      if (code && code.data) {
        stopCamera();
        closeModal();
        return openScannedRoom(code.data);
      }
    }
    window.setTimeout(function() { scanVideoFrame(video); }, 220);
  }

  async function openScannedRoom(qrPayload) {
    renderLoading();
    try {
      state.scanned = await apiCall('scanRoom', { qrPayload: qrPayload, userAgent: navigator.userAgent });
      renderSlotSelection();
    } catch (error) {
      renderScannerHome();
      handleApiError(error);
    }
  }

  function renderSlotSelection() {
    var data = state.scanned;
    var slots = data.slots.map(function(slot) {
      var done = slot.completed;
      return '<button class="management-item" style="width:100%;text-align:left" ' +
        (done ? 'disabled' : 'onclick="selectSlot(\'' + jsq(slot.slotId) + '\')"') + '><div><strong>' +
        esc(slot.name) + '</strong><span>' + (done ? 'Sudah diisi oleh ' + esc(done.officerName) + ' • ' +
        esc(done.displayTime) : 'Belum diisi') + '</span></div>' + (done ? statusBadge(done.overallStatus) : '<span>Isi →</span>') + '</button>';
    }).join('');
    var prior = '';
    if (data.petugasResults && data.petugasResults.length) {
      prior = '<section class="panel"><div class="panel-head"><h2>Hasil petugas hari ini</h2></div><div class="panel-body">' +
        data.petugasResults.map(function(item) {
          return '<div class="management-item"><div><strong>' + esc(item.slotName) + '</strong><span>' +
            esc(item.officerName) + ' • ' + esc(item.displayTime) + '</span></div>' + statusBadge(item.overallStatus) + '</div>';
        }).join('') + '</div></section>';
    }
    appRoot().innerHTML = renderHeader(data.room.name) + '<main class="page">' +
      '<section class="room-banner"><div><div class="eyebrow" style="color:#ffd100">LOKASI TERVERIFIKASI</div><h1>' +
      esc(data.room.name) + '</h1><p>' + esc(data.roomType.name) + ' • ' + esc(formatDateKey(data.dateKey)) + '</p></div>' +
      '<div class="scan-box"><span>Waktu pemindaian</span><strong>' + esc(data.scan.displayTime) + ' WIB</strong></div></section>' +
      '<section class="panel"><div class="panel-head"><h2>Pilih waktu pemeriksaan</h2></div><div class="panel-body"><div class="management-list">' +
      (slots || '<div class="empty">Tidak ada slot untuk peran akun ini.</div>') + '</div></div></section>' + prior +
      '<button class="btn btn-secondary" onclick="renderScannerHome()">Pindai ruangan lain</button></main>';
  }

  function selectSlot(slotId) {
    state.selectedSlot = state.scanned.slots.find(function(slot) { return slot.slotId === slotId; });
    state.evidenceData = '';
    renderChecklist();
  }

  function renderChecklist() {
    var data = state.scanned;
    var cards = data.activities.map(function(activity, index) {
      var id = attr(activity.activityId);
      var quality = activity.qualityApplicable ? dimensionChoices_(id, 'quality', 'Aktivitas / kualitas',
        activity.qualityPositive, activity.qualityNegative) : '';
      var func = activity.functionApplicable ? dimensionChoices_(id, 'function', 'Fungsi / kondisi',
        activity.functionPositive, activity.functionNegative) : '';
      return '<section class="activity-card" data-activity-id="' + id + '"><div class="activity-head">' +
        '<div class="activity-number">' + (index + 1) + '</div><div class="activity-name">' + esc(activity.name) + '</div></div>' +
        '<div class="activity-choices">' + quality + func + '</div>' +
        '<div class="field"><label>Catatan temuan</label><textarea id="note-' + id +
        '" placeholder="Wajib jika salah satu hasil negatif"></textarea></div></section>';
    }).join('');
    appRoot().innerHTML = renderHeader(data.room.name + ' • ' + state.selectedSlot.name) +
      '<main class="page"><section class="room-banner"><div><div class="eyebrow" style="color:#ffd100">' +
      esc(state.selectedSlot.name.toUpperCase()) + '</div><h1>' + esc(data.room.name) + '</h1>' +
      '<p>Isi kedua bagian yang tersedia pada setiap indikator.</p></div></section>' +
      '<form onsubmit="submitChecklist(event)"><div class="checklist">' + cards + '</div>' +
      '<section class="panel"><div class="panel-head"><div><h2>Foto evidence</h2>' +
      '<div class="field-hint">Tepat satu foto wajib diambil langsung, baik hasil bersih maupun ada temuan.</div></div></div>' +
      '<div class="panel-body"><div id="evidence-preview" class="photo-preview empty">Belum ada foto evidence.</div>' +
      '<button type="button" class="btn btn-secondary" style="margin-top:14px" onclick="openEvidenceCamera()">Ambil foto</button></div></section>' +
      '<div class="submit-bar"><button type="button" class="btn btn-secondary" onclick="renderSlotSelection()">Kembali</button>' +
      '<button id="submit-button" class="btn btn-primary">Kirim pemeriksaan</button></div></form></main>';
  }

  function dimensionChoices_(id, field, label, positive, negative) {
    return '<div class="choice-row"><span class="choice-label">' + esc(label) + ' <span class="required">*</span></span>' +
      '<div class="choice-group"><div class="choice clean"><input type="radio" id="' + field + '-p-' + id +
      '" name="' + field + '-' + id + '" value="POSITIVE"><label for="' + field + '-p-' + id + '">' + esc(positive) + '</label></div>' +
      '<div class="choice dirty"><input type="radio" id="' + field + '-n-' + id +
      '" name="' + field + '-' + id + '" value="NEGATIVE"><label for="' + field + '-n-' + id + '">' + esc(negative) + '</label></div></div></div>';
  }

  async function openEvidenceCamera() {
    showModal('Ambil foto evidence',
      '<div class="camera-frame"><video id="evidence-video" playsinline autoplay muted></video><canvas id="evidence-canvas" class="hidden"></canvas></div>' +
      '<p class="field-hint">Pastikan kondisi ruangan terlihat jelas.</p><div id="evidence-camera-error"></div>' +
      '<div class="camera-fallback"><label class="btn btn-secondary" for="evidence-photo-input">Buka kamera HP</label>' +
      '<input class="capture-input" id="evidence-photo-input" type="file" accept="image/*" capture="environment" onchange="captureEvidenceFile(event)">' +
      '<div class="field-hint">Foto diproses langsung di aplikasi dan tidak dipilih melalui tombol unggah biasa.</div></div>',
      '<button class="btn btn-secondary" onclick="closeModal()">Batal</button><button id="stream-capture-button" class="btn btn-primary" onclick="captureEvidence()">Ambil dari video</button>',
      'modal-wide');
    try {
      state.cameraStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false
      });
      var video = document.getElementById('evidence-video');
      video.srcObject = state.cameraStream;
      await video.play();
    } catch (error) {
      stopCamera();
      var target = document.getElementById('evidence-camera-error');
      if (target) target.innerHTML = '<div class="notice notice-warning">' + esc(cameraErrorMessage_(error)) +
        '<br>Gunakan tombol <strong>Buka kamera HP</strong> di bawah.</div>';
      var streamButton = document.getElementById('stream-capture-button');
      if (streamButton) streamButton.classList.add('hidden');
    }
  }

  async function captureEvidenceFile(event) {
    var file = event.target.files && event.target.files[0];
    if (!file) return;
    try {
      state.evidenceData = await resizeImageFile_(file, 1280, 0.78);
      stopCamera(); closeModal();
      document.getElementById('evidence-preview').className = 'photo-preview';
      document.getElementById('evidence-preview').innerHTML =
        '<img src="' + state.evidenceData + '" alt="Foto evidence">';
    } catch (error) {
      toast('Foto evidence tidak dapat diproses.', 'error');
    } finally {
      event.target.value = '';
    }
  }

  function captureEvidence() {
    var video = document.getElementById('evidence-video');
    if (!video || !video.videoWidth) return;
    var canvas = document.getElementById('evidence-canvas');
    var width = Math.min(1280, video.videoWidth);
    var height = Math.round(video.videoHeight * width / video.videoWidth);
    canvas.width = width; canvas.height = height;
    canvas.getContext('2d').drawImage(video, 0, 0, width, height);
    state.evidenceData = canvas.toDataURL('image/jpeg', 0.78);
    stopCamera(); closeModal();
    document.getElementById('evidence-preview').className = 'photo-preview';
    document.getElementById('evidence-preview').innerHTML = '<img src="' + state.evidenceData + '" alt="Foto evidence">';
  }

  async function submitChecklist(event) {
    event.preventDefault();
    var answers = [];
    for (var i = 0; i < state.scanned.activities.length; i++) {
      var activity = state.scanned.activities[i];
      var q = activity.qualityApplicable ? document.querySelector('input[name="quality-' + cssEscape(activity.activityId) + '"]:checked') : null;
      var f = activity.functionApplicable ? document.querySelector('input[name="function-' + cssEscape(activity.activityId) + '"]:checked') : null;
      if ((activity.qualityApplicable && !q) || (activity.functionApplicable && !f)) {
        return toast('Semua indikator wajib diisi.', 'error');
      }
      var note = document.getElementById('note-' + activity.activityId).value.trim();
      if ((q && q.value === 'NEGATIVE') || (f && f.value === 'NEGATIVE')) {
        if (!note) return toast('Catatan wajib pada setiap indikator yang memiliki temuan.', 'error');
      }
      answers.push({
        activityId: activity.activityId,
        qualityResult: q ? q.value : 'NA',
        functionResult: f ? f.value : 'NA',
        note: note
      });
    }
    if (!state.evidenceData) return toast('Ambil satu foto evidence sebelum mengirim.', 'error');
    var button = document.getElementById('submit-button');
    button.disabled = true; button.textContent = 'Menyimpan...';
    try {
      var result = await apiCall('submitInspection', {
        scanId: state.scanned.scan.scanId, slotId: state.selectedSlot.slotId,
        answers: answers, evidenceData: state.evidenceData
      });
      toast('Pemeriksaan berhasil disimpan.', 'success');
      appRoot().innerHTML = renderHeader(result.roomName) +
        '<main class="page"><section class="panel"><div class="panel-body">' +
        '<div class="notice notice-success"><strong>Pemeriksaan berhasil disimpan.</strong><br>' +
        esc(result.slotName) + ' • ' + esc(result.displayTime) + ' WIB</div>' +
        '<p>Hasil: ' + statusBadge(result.overallStatus) + ' &nbsp; Temuan: <strong>' +
        Number(result.dirtyCount) + '</strong></p><button class="btn btn-primary" onclick="renderScannerHome()">Pindai ruangan</button>' +
        '</div></section></main>';
    } catch (error) {
      button.disabled = false; button.textContent = 'Kirim pemeriksaan';
      handleApiError(error);
    }
  }

  function renderAdmin() {
    var tabs = [
      ['dashboard', 'Ringkasan'], ['qr', 'QR Ruangan'], ['export', 'Ekspor Excel'],
      ['management', 'Pengelolaan'], ['settings', 'Konfigurasi']
    ];
    appRoot().innerHTML = renderHeader('Portal administrasi') +
      '<nav class="admin-nav"><div class="admin-nav-inner">' + tabs.map(function(tab) {
        return '<button class="' + (state.adminTab === tab[0] ? 'active' : '') +
          '" onclick="switchAdminTab(\'' + tab[0] + '\')">' + tab[1] + '</button>';
      }).join('') + '</div></nav><main class="page" id="admin-content"></main>';
    renderAdminTab();
  }

  function switchAdminTab(tab) {
    state.adminTab = tab;
    renderAdmin();
  }

  function renderAdminTab() {
    if (state.adminTab === 'dashboard') return renderDashboard();
    if (state.adminTab === 'qr') return renderQr();
    if (state.adminTab === 'export') return renderExport();
    if (state.adminTab === 'management') return renderManagement();
    renderSettings();
  }

  function renderDashboard() {
    var root = document.getElementById('admin-content');
    var dash = state.bootstrap.dashboard;
    root.innerHTML = '<section class="panel"><div class="panel-head"><div><h2>Ringkasan pemeriksaan</h2>' +
      '<div class="field-hint">Filter berdasarkan bulan dan ruangan.</div></div><div class="filter-row">' +
      '<label class="filter-control"><span>Bulan</span><input id="dash-month" type="month" value="' + attr(dash.month) + '"></label>' +
      '<label class="filter-control"><span>Ruangan</span><select id="dash-room"><option value="">Semua ruangan</option>' + dash.rooms.map(function(room) {
        return '<option value="' + attr(room.roomId) + '"' + (dash.roomId === room.roomId ? ' selected' : '') + '>' + esc(room.name) + '</option>';
      }).join('') + '</select></label><button class="btn btn-primary filter-action" onclick="refreshDashboard()">Terapkan filter</button></div></div></section>' +
      '<div class="stats-grid"><div class="stat-card"><span>Total kiriman</span><strong>' + dash.totals.submissions +
      '</strong></div><div class="stat-card clean"><span>Bersih</span><strong>' + dash.totals.clean +
      '</strong></div><div class="stat-card dirty"><span>Ada temuan</span><strong>' + dash.totals.findings +
      '</strong></div><div class="stat-card"><span>Menunggu sinkronisasi</span><strong>' + dash.totals.pendingBackup + '</strong></div></div>' +
      '<section class="panel"><div class="panel-head"><h2>Kiriman terbaru</h2></div><div class="table-wrap"><table><thead><tr>' +
      '<th>Tanggal</th><th>Ruangan</th><th>Slot</th><th>Petugas</th><th>Hasil</th><th>Storage</th></tr></thead><tbody>' +
      (dash.recent.length ? dash.recent.map(function(item) {
        return '<tr><td>' + esc(item.dateKey) + '</td><td>' + esc(item.roomName) + '</td><td>' + esc(item.slotName) +
          '</td><td>' + esc(item.officerName) + '</td><td>' + statusBadge(item.overallStatus) +
          '</td><td>' + esc(item.backupStatus) + '</td></tr>';
      }).join('') : '<tr><td colspan="6" class="empty">Belum ada data.</td></tr>') + '</tbody></table></div></section>';
  }

  async function refreshDashboard() {
    try {
      state.bootstrap = await apiCall('bootstrap', {
        month: document.getElementById('dash-month').value,
        roomId: document.getElementById('dash-room').value
      });
      renderDashboard();
    } catch (error) { handleApiError(error); }
  }

  async function renderQr() {
    var root = document.getElementById('admin-content');
    root.innerHTML = '<section class="panel"><div class="empty">Mempersiapkan QR...</div></section>';
    try {
      var rooms = await apiCall('getQrData', {});
      root.innerHTML = '<section class="panel"><div class="panel-head"><div><h2>QR Code ruangan</h2>' +

  function printQrCodes() {

      var sourceImage = card.querySelector('.qr-code img');
      var qrData = sourceCanvas ? sourceCanvas.toDataURL('image/png') : (sourceImage ? sourceImage.src : '');

      if (target && qrData) {

  function setExportProgress_(percent, label, failed) {

    bar.classList.toggle('failed', Boolean(failed));

  function cameraErrorMessage_(error) {
    var name = error && error.name ? error.name : '';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return 'Browser ini tidak menyediakan mode video kamera untuk halaman aplikasi.';
    }
    if (name === 'NotAllowedError' || name === 'SecurityError') {
      return 'Mode video kamera dibatasi oleh browser atau bingkai keamanan Google Apps Script, meskipun izin situs sudah diberikan.';
    }
    if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
      return 'Kamera tidak ditemukan pada perangkat.';
    }
    if (name === 'NotReadableError' || name === 'TrackStartError') {
      return 'Kamera sedang digunakan aplikasi lain. Tutup aplikasi kamera lain lalu coba kembali.';
    }
    return 'Mode video kamera tidak dapat dimulai' + (name ? ' (' + name + ')' : '') + '.';
  }
  function loadImageFile_(file) {
    return new Promise(function(resolve, reject) {
      var reader = new FileReader();
      reader.onerror = reject;
      reader.onload = function() {
        var image = new Image();
        image.onerror = reject;
        image.onload = function() { resolve(image); };
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  async function resizeImageFile_(file, maxWidth, quality) {
    var image = await loadImageFile_(file);
    var scale = Math.min(1, maxWidth / image.width);
    var canvas = document.createElement('canvas');
    canvas.width = Math.round(image.width * scale);
    canvas.height = Math.round(image.height * scale);
    canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', quality);
  }

  function toast(message, tone) {
    var item = document.createElement('div'); item.className = 'toast ' + (tone || ''); item.textContent = message;
    document.getElementById('toast-region').appendChild(item);
    window.setTimeout(function() { item.remove(); }, 4200);

  function handleApiError(error) {
    if (isSessionError(error)) { clearSession(); closeModal(); return renderLogin(error.message); }
    toast(error.message || 'Terjadi kesalahan.', 'error');

  function isSessionError(error) {
    return ['SESSION_REQUIRED','SESSION_INVALID','SESSION_EXPIRED','USER_INACTIVE'].indexOf(error.code) !== -1;
  }
  function roleLabel(role) {
    return role === 'ADMIN' ? 'Administrator' : role === 'SUPERVISOR' ? 'Supervisor' : 'Petugas';
  }
  function statusBadge(status) {
    return status === 'BERSIH' ? '<span class="badge badge-clean">Bersih</span>' :
      '<span class="badge badge-dirty">Ada temuan</span>';
  }
  function formatDateKey(dateKey) {
    var parts = String(dateKey || '').split('-');
    if (parts.length !== 3) return dateKey;
    var months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    return Number(parts[2]) + ' ' + months[Number(parts[1]) - 1] + ' ' + parts[0];
  }
  function startOfCurrentPeriod_() {
    var date = new Date();
    var offset = date.getTimezoneOffset() * 60000;
    return new Date(date.getTime() - offset).toISOString().slice(0, 10);
  }
  function downloadDataUrl(dataUrl, fileName) {
    var link = document.createElement('a'); link.href = dataUrl; link.download = fileName;
    document.body.appendChild(link); link.click(); link.remove();
  }
  function appRoot() { return document.getElementById('app'); }
  function esc(value) {
    return String(value === undefined || value === null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }
  function attr(value) { return esc(value); }
  function jsq(value) { return String(value || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\r?\n/g, ' '); }
  function cssEscape(value) { return window.CSS && CSS.escape ? CSS.escape(value) : String(value).replace(/[^a-zA-Z0-9_-]/g, '\\$&'); }
</script>
