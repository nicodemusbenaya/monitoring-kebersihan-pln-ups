services:
  ups-earsip-gateway:
    image: node:20-alpine
    container_name: ups-earsip-gateway-v3
    working_dir: /app
    command: sh -c "npm install --omit=dev && npm start"
    restart: unless-stopped
    ports:
      - "18080:8080"
    env_file:
      - /share/Container/gateway-v3/.env
    environment:
      NODE_PATH: /app/node_modules
      MONITORING_APP_PATH: /monitoring/server.js
      MONITORING_STORAGE_ROOT: /monitoring-data
      MONITORING_TIMEZONE: Asia/Jakarta
    volumes:
      - /share/Container/gateway-v3:/app
      - gateway_v3_node_modules:/app/node_modules
      - /share/UPS-EARSIP:/data
      - /share/Container/monitoring-kebersihan-gateway:/monitoring:ro
      - /share/Container/gateway-v3/MONITORING-KEBERSIHAN-DATA:/monitoring-data
volumes:
  gateway_v3_node_modules:
